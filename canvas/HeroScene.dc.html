<script type="text/x-dc" data-dc-script data-props='{"at":{"editor":null},"$preview":{"width":620,"height":560}}'>
class Component extends DCLogic {
  componentDidMount() {
    if (typeof window === 'undefined' || typeof document === 'undefined') return;
    const root = document.querySelector('[data-hs="' + this.uid + '"]');
    if (!root) return;
    // Scale the 620 × 560 scene to the width it is given.
    const fit = () => {
      const w = root.clientWidth;
      if (w > 0) root.style.setProperty('--k', Math.min(1, w / 620).toFixed(4));
    };
    fit();
    if (window.ResizeObserver) {
      // Fitting changes the size being watched, so it waits a frame: no resize loop.
      this.ro = new ResizeObserver(() => { cancelAnimationFrame(this.fitRaf); this.fitRaf = requestAnimationFrame(fit); });
      this.ro.observe(root);
    } else {
      this.onResize = fit;
      window.addEventListener('resize', fit);
    }
    const at = this.props.at;
    const pinned = at !== undefined && at !== null && at !== '';
    const still = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    if (!root.animate || (still && !pinned)) return;
    this.anims = this.build(root);
    if (pinned) {
      const t = Number(at) || 0;
      this.anims.forEach((a) => { a.currentTime = t; a.pause(); });
      return;
    }
    // Play only while the scene is on screen.
    if (window.IntersectionObserver) {
      this.io = new IntersectionObserver((es) => {
        const on = es[es.length - 1].isIntersecting;
        this.anims.forEach((a) => (on ? a.play() : a.pause()));
      });
      this.io.observe(root);
    }
  }
  componentWillUnmount() {
    if (this.ro) this.ro.disconnect();
    cancelAnimationFrame(this.fitRaf);
    if (this.onResize) window.removeEventListener('resize', this.onResize);
    if (this.io) this.io.disconnect();
    (this.anims || []).forEach((a) => a.cancel());
  }
  build(root) {
    // One 16-second class: the tap at 1.2 s, the room fills in by 5.9 s, an unlock at 7.5 s, the bell at 12 s.
    const T = 16000;
    const E = 'cubic-bezier(0.2, 0, 0, 1)';
    const out = [];
    const run = (el, frames) => {
      if (!el) return;
      const fr = frames.map((f) => Object.assign({ offset: f[0] / T, easing: f[2] || E }, f[1]));
      out.push(el.animate(fr, { duration: T, iterations: Infinity, fill: 'both' }));
    };
    const fade = (el, pts) => run(el, pts.map((p) => [p[0], { opacity: p[1] }]));
    const q = (s) => root.querySelector(s);
    const rest = 'translate(0px, 0px) rotate(0deg)';
    const up = 'translate(4px, -34px) rotate(-5deg)';
    run(q('.hs-phone'), [[0, { transform: rest }], [700, { transform: rest }], [1150, { transform: up }], [1500, { transform: up }], [1950, { transform: rest }], [T, { transform: rest }]]);
    run(q('.hs-block'), [[0, { transform: 'scale(1)' }], [1120, { transform: 'scale(1)' }], [1240, { transform: 'scale(0.95)' }], [1480, { transform: 'scale(1)' }], [T, { transform: 'scale(1)' }]]);
    const ripple = (el, d) => run(el, [[0, { transform: 'scale(1)', opacity: 0 }], [1150 + d, { transform: 'scale(1)', opacity: 0 }], [1210 + d, { transform: 'scale(1.06)', opacity: 0.85 }], [2350 + d, { transform: 'scale(2.9)', opacity: 0 }], [T, { transform: 'scale(2.9)', opacity: 0 }]]);
    ripple(q('.hs-r1'), 0);
    ripple(q('.hs-r2'), 240);
    fade(q('.hs-scr-home'), [[0, 1], [1550, 1], [1850, 0], [14600, 0], [15100, 1], [T, 1]]);
    fade(q('.hs-scr-focus'), [[0, 0], [1550, 0], [1850, 1], [12000, 1], [12300, 0], [T, 0]]);
    // Right after the tap: an arrow and a pill point at Ana's phone, now locked.
    run(q('.hs-arrow-p'), [[0, { strokeDashoffset: 1 }], [1950, { strokeDashoffset: 1 }], [2350, { strokeDashoffset: 0 }], [6800, { strokeDashoffset: 0 }], [7200, { strokeDashoffset: 0 }], [T, { strokeDashoffset: 1 }]]);
    fade(q('.hs-arrow'), [[0, 1], [6800, 1], [7200, 0], [T - 1, 0], [T, 1]]);
    fade(q('.hs-arrow-h'), [[0, 0], [2250, 0], [2350, 1], [6800, 1], [7200, 0], [T, 0]]);
    run(q('.hs-locked'), [[0, { opacity: 0, transform: 'translateX(8px)' }], [2100, { opacity: 0, transform: 'translateX(8px)' }], [2400, { opacity: 1, transform: 'translateX(0px)' }], [6800, { opacity: 1, transform: 'translateX(0px)' }], [7200, { opacity: 0, transform: 'translateX(0px)' }], [T, { opacity: 0, transform: 'translateX(8px)' }]]);
    fade(q('.hs-scr-over'), [[0, 0], [12000, 0], [12300, 1], [14600, 1], [15000, 0], [T, 0]]);
    fade(q('.hs-sig'), [[0, 0], [1800, 0], [1950, 1], [2450, 1], [2750, 0], [T, 0]]);
    const dot = q('.hs-dot');
    if (dot && window.CSS && CSS.supports && CSS.supports('offset-path', 'path("M 0 0 L 10 10")')) {
      run(dot, [[0, { offsetDistance: '0%', opacity: 0 }], [1820, { offsetDistance: '0%', opacity: 0 }], [1880, { offsetDistance: '0%', opacity: 1 }], [2520, { offsetDistance: '100%', opacity: 1 }], [2620, { offsetDistance: '100%', opacity: 0 }], [T, { offsetDistance: '100%', opacity: 0 }]]);
    }
    // Ana taps in first (her phone is the one shown), then ten more; Diego never does.
    const at = { 0: 2600 };
    [4, 9, 1, 7, 2, 10, 6, 3, 8, 5].forEach((idx, j) => { at[idx] = 3000 + j * 300; });
    Array.prototype.slice.call(root.querySelectorAll('.hs-tile')).forEach((tile) => {
      const t = at[Number(tile.getAttribute('data-i'))];
      if (t === undefined) return;
      fade(tile.querySelector('.hs-t-on'), [[0, 0], [t, 0], [t + 150, 1], [14600, 1], [15100, 0], [T, 0]]);
      run(tile, [[0, { transform: 'scale(1)' }], [t, { transform: 'scale(1)' }], [t + 90, { transform: 'scale(0.94)' }], [t + 320, { transform: 'scale(1)' }], [T, { transform: 'scale(1)' }]]);
    });
    const k = q('.hs-tile[data-i="6"]');
    if (k) {
      fade(k.querySelector('.hs-t-unl'), [[0, 0], [7500, 0], [7650, 1], [14600, 1], [15100, 0], [T, 0]]);
      // bali-softpulse: the glow ring swells and fades, 1.2 s, exactly twice.
      const g0 = '0 0 0 0px rgba(219, 147, 71, 0)';
      const g1 = '0 0 0 6px rgba(219, 147, 71, 0.35)';
      run(k, [[0, { boxShadow: g0 }], [7650, { boxShadow: g0 }], [8250, { boxShadow: g1 }], [8850, { boxShadow: g0 }], [9450, { boxShadow: g1 }], [10050, { boxShadow: g0 }], [T, { boxShadow: g0 }]]);
    }
    run(q('.hs-pop'), [[0, { opacity: 0, transform: 'translateY(10px)' }], [7700, { opacity: 0, transform: 'translateY(10px)' }], [8000, { opacity: 1, transform: 'translateY(0px)' }], [11800, { opacity: 1, transform: 'translateY(0px)' }], [12100, { opacity: 0, transform: 'translateY(0px)' }], [T, { opacity: 0, transform: 'translateY(10px)' }]]);
    fade(q('.hs-grid'), [[0, 1], [12000, 1], [12300, 0.45], [14600, 0.45], [15100, 1], [T, 1]]);
    fade(q('.hs-live'), [[0, 1], [12000, 1], [12300, 0], [14600, 0], [15100, 1], [T, 1]]);
    fade(q('.hs-ended'), [[0, 0], [12000, 0], [12300, 1], [14600, 1], [15100, 0], [T, 0]]);
    fade(q('.hs-count'), [[0, 1], [12000, 1], [12300, 0], [14600, 0], [15100, 1], [T, 1]]);
    return out;
  }
  renderVals() {
    if (!this.uid) this.uid = 'hs' + Math.random().toString(36).slice(2, 9);
    const names = ['Ana R.', 'Marcus B.', 'Priya N.', 'Jaylen B.', 'Sofia M.', 'Tomás H.', 'Keisha T.', 'Wei Z.', 'Amara O.', 'Liam O.', 'Fatima A.', 'Diego R.'];
    return {
      uid: this.uid,
      tiles: names.map((name, i) => ({ i: i, name: name, onCls: 'hs-t hs-t-on' + (i === 11 ? ' is-off' : ''), unl: i === 6 })),
    };
  }
}
</script>
