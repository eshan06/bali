      out.push(el.animate(fr, Object.assign({ duration: T, iterations: Infinity, fill: 'both' }, opts || {})));
    };
    const all = (s) => Array.prototype.slice.call(root.querySelectorAll(s));
    // The laptop's grid: each tile turns green as a student taps in.
    all('.ms-tile').forEach((el, i) => {
      const t = 500 + i * 230;
      run(el, [[0, { fill: '#E3DFD8' }], [t, { fill: '#E3DFD8' }], [t + 200, { fill: '#3F8765' }], [11300, { fill: '#3F8765' }], [11800, { fill: '#E3DFD8' }], [T, { fill: '#E3DFD8' }]]);
    });
    // The board: the teacher draws the axes, the curve, then the working, and wipes it at the end.
    const ink = all('.ms-ink');
    const starts = [3200, 3700, 5000, 5700, 6400, 7100];
    const lens = [450, 1200, 650, 600, 650, 450];
    ink.forEach((el, i) => {
      const s0 = starts[i] || 3200;
      const l0 = lens[i] || 500;
      run(el, [[0, { strokeDashoffset: 1, opacity: 1 }], [s0, { strokeDashoffset: 1, opacity: 1 }], [s0 + l0, { strokeDashoffset: 0, opacity: 1 }], [11000, { strokeDashoffset: 0, opacity: 1 }], [11600, { strokeDashoffset: 0, opacity: 0 }], [T, { strokeDashoffset: 1, opacity: 0 }]]);
    });
    // The teacher's arm: lowered while the class taps in, up to write, a small hand movement while writing.
    const arm = root.querySelector('.ms-tarm');
    if (arm) {
      const fr = [[0, { transform: 'rotate(58deg)' }], [2700, { transform: 'rotate(58deg)' }], [3200, { transform: 'rotate(0deg)' }]];
      for (let t = 3200, k = 0; t < 7500; t += 260, k++) fr.push([t, { transform: 'rotate(' + (k % 2 ? 3 : -3) + 'deg)' }]);
      fr.push([7600, { transform: 'rotate(0deg)' }], [8200, { transform: 'rotate(58deg)' }], [T, { transform: 'rotate(58deg)' }]);
      run(arm, fr);
    }
    // Students write: a small, steady pencil movement in turns.
    all('.ms-write').forEach((el, i) => {
      const s0 = 1800 + i * 1500;
      const fr = [[0, { transform: 'rotate(0deg)' }], [s0, { transform: 'rotate(0deg)' }]];
      for (let t = s0, k = 0; t < s0 + 2600; t += 220, k++) fr.push([t, { transform: 'rotate(' + (k % 2 ? 4 : -2) + 'deg)' }]);
      fr.push([s0 + 2800, { transform: 'rotate(0deg)' }], [T, { transform: 'rotate(0deg)' }]);
      run(el, fr);
    });
    // One hand goes up with a question, then comes back down.
    all('.ms-raise').forEach((el) => run(el, [[0, { transform: 'rotate(0deg)' }], [8200, { transform: 'rotate(0deg)' }], [8700, { transform: 'rotate(78deg)' }], [10200, { transform: 'rotate(78deg)' }], [10700, { transform: 'rotate(0deg)' }], [T, { transform: 'rotate(0deg)' }]]));
    // Heads follow the lesson: up to the board, down to the notebook.
    all('.ms-head').forEach((el, i) => run(el, [[0, { transform: 'rotate(0deg)' }], [T / 2, { transform: 'rotate(' + (i % 2 ? 5 : -4) + 'deg)' }], [T, { transform: 'rotate(0deg)' }]], { delay: -((i * 1370) % T) }));
    // The phones stay locked in the backpacks, their rings glowing softly.
    all('.ms-glow').forEach((el, i) => run(el, [[0, { opacity: 0.35 }], [T / 2, { opacity: 1 }], [T, { opacity: 0.35 }]], { delay: -((i * 1733) % T) }));
    // The light on the floor breathes; the plant's leaves sway a little.
    run(root.querySelector('.ms-sun'), [[0, { opacity: 0.55 }], [T / 2, { opacity: 0.85 }], [T, { opacity: 0.55 }]]);
    all('.ms-leaf').forEach((el, i) => run(el, [[0, { transform: 'translateY(0px)' }], [T / 2, { transform: 'translateY(' + (i % 2 ? -1.2 : 1) + 'px)' }], [T, { transform: 'translateY(0px)' }]], { delay: -(i * 2100) }));
    return out;
  }
  renderVals() {
    if (!this.uid) this.uid = 'ms' + Math.random().toString(36).slice(2, 9);
    return { uid: this.uid };
  }
}
</script>
