<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — W5–W7 · Roster, Policies, Tags</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="pass2/components.css">
<link rel="stylesheet" href="pass3/sheet.css">
<link rel="stylesheet" href="pass4/web.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>.sheet { max-width: 1500px; }</style>
</head>
<body>
<div class="sheet">
  <header class="masthead" data-screen-label="Pass 4 — W5–W7">
    <div class="kicker">
      <svg class="arc-mark" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.5" stroke="var(--stone-200)" stroke-width="3"></circle><path d="M 10 2.5 A 7.5 7.5 0 1 1 3.5 13.75" stroke="var(--green-600)" stroke-width="3" stroke-linecap="round"></path></svg>
      Bali · Pass 4 of 4 · Web
    </div>
    <h1>W5–W7 · Roster · Policies · Tags</h1>
    <p>Class administration. The join code is projector-first on the roster; the policy editor restates the device-mapping honesty rule; tag cards are built around a print-ready QR.</p>
    <nav class="crumbs">
      <a href="W4 Live Dashboard.html">W4</a>
      <a href="W1-W3 Login Fallback Classes.html">W1–W3</a>
      <a class="here" href="W5-W7 Roster Policies Tags.html">W5–W7</a>
      <a href="W8-W10 Reports Logs Settings.html">W8–W10</a>
      <a href="pass3/S6 Focus Active.html">iOS ↗</a>
      <a href="Bali - Landing.html">Landing ↗</a>
    </nav>
  </header>
  <div id="frames" style="display: flex; flex-direction: column; gap: 48px;"></div>
</div>

<script>
function sidenav(active) {
  const items = [["layout-grid", "Classes"], ["list-checks", "Policies"], ["nfc", "Tags"], ["chart-bar", "Reports"], ["scroll-text", "Logs"], ["settings", "Settings"]];
  return `<aside class="sidenav">
    <div class="brand"><svg viewBox="0 0 20 20" fill="none" style="width:18px;height:18px;"><circle cx="10" cy="10" r="7.5" stroke="var(--stone-200)" stroke-width="3"></circle><path d="M 10 2.5 A 7.5 7.5 0 1 1 3.5 13.75" stroke="var(--green-600)" stroke-width="3" stroke-linecap="round"></path></svg>Bali</div>
    ${items.map(([ic, l]) => `<a class="${l === active ? "on" : ""}" href="#"><i data-lucide="${ic}"></i>${l}</a>`).join("")}
    <div class="foot"><div class="ava">MR</div><div class="who">Ms. Rivera<small>Jefferson High</small></div></div>
  </aside>`;
}
function frame(label, sub, note, inner) {
  return `<div class="wframe-cell"><div class="wf-label">${label}${sub ? `<small>${sub}</small>` : ""}</div>
    <div class="wframe">${inner}</div>${note ? `<div class="wf-note">${note}</div>` : ""}</div>`;
}
const chipMini = (s, l, icon) => `<span class="fc-chip fc-chip--mini is-${s}"><i data-lucide="${icon}"></i><span class="lbl">${l}</span></span>`;

/* ---------- W5 ROSTER ---------- */
const memberRow = (name, status, joined, icon) => `
  <tr><td><b>${name}</b></td>
  <td>${chipMini(status[0], status[1], icon)}</td>
  <td class="num">${joined}</td>
  <td style="text-align: right;"><button class="fc-btn fc-btn--ghost" style="padding: 4px 10px; font-size: 13px; color: var(--text-secondary);">Remove…</button></td></tr>`;
const w5 = `<div class="shell">${sidenav("Classes")}<main class="main">
  <div class="main-head">
    <div><h1>Period 3 — Algebra II · Roster</h1><div class="meta">28 members · 2 pending</div></div>
    <div style="margin-left: auto; display: flex; gap: 10px;"><button class="fc-btn fc-btn--secondary"><i data-lucide="monitor"></i>Project this</button></div>
  </div>
  <div style="display: grid; grid-template-columns: 1fr 360px; gap: 20px; align-items: start;">
    <div style="display: flex; flex-direction: column; gap: 18px;">
      <div class="wcard" style="padding: 0; overflow: hidden; border-color: var(--orange-200); ">
        <div style="padding: 14px 20px; display: flex; align-items: center; gap: 10px; background: var(--orange-50); border-bottom: 1px solid var(--orange-100);">
          <i data-lucide="user-plus" style="width: 16px; height: 16px; color: var(--orange-700);"></i>
          <span style="font: 600 14px/19px 'Instrument Sans', sans-serif;">Waiting for approval</span>
        </div>
        ${["Casey Nguyen", "Robbie Fox"].map((n, i) => `
        <div style="display: flex; align-items: center; gap: 12px; padding: 12px 20px; ${i === 0 ? "border-bottom: 1px solid var(--border-default);" : ""}">
          <b style="font: 600 14px/19px 'Instrument Sans', sans-serif;">${n}</b>
          <span style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary);">entered code today</span>
          <div style="margin-left: auto; display: flex; gap: 8px;">
            <button class="fc-btn fc-btn--primary" style="padding: 6px 14px; font-size: 13px;">Approve</button>
            <button class="fc-btn fc-btn--secondary" style="padding: 6px 14px; font-size: 13px;">Decline</button>
          </div>
        </div>`).join("")}
      </div>
      <table class="wtable">
        <tr><th>Member</th><th>Right now</th><th>Joined</th><th></th></tr>
        ${memberRow("Jordan Park", ["focused", "Focused"], "Sep 3", "circle-check")}
        ${memberRow("Aisha Khan", ["pass", "Pass · 4:32"], "Sep 3", "ticket")}
        ${memberRow("Sam Torres", ["emergency", "Unlocked"], "Sep 4", "lock-open")}
        ${memberRow("Diego Morales", ["revoked", "Permission off"], "Sep 3", "shield-off")}
        ${memberRow("Priya Shah", ["nodevice", "No device"], "Sep 8", "smartphone")}
        ${memberRow("Maya Rodriguez", ["notjoined", "Not in"], "Sep 3", "circle")}
      </table>
      <div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary);">… 22 more focused members</div>
    </div>
    <div class="wcard" style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 28px 20px;">
      <div class="wlabel">Join code</div>
      <div class="fc-joincode fc-joincode--card"><span class="code">KM3W7Q2A</span></div>
      <div style="display: flex; gap: 8px;">
        <button class="fc-btn fc-btn--secondary" style="padding: 7px 14px; font-size: 13px;"><i data-lucide="copy"></i>Copy</button>
        <button class="fc-btn fc-btn--secondary" style="padding: 7px 14px; font-size: 13px;"><i data-lucide="monitor"></i>Project this</button>
      </div>
      <div style="font: 400 12.5px/18px 'Instrument Sans', sans-serif; color: var(--text-tertiary); text-align: center;">"Project this" fills the screen with the code at 88px — readable from the back row.</div>
    </div>
  </div>
</main></div>`;

/* ---------- W6 POLICIES ---------- */
const togglerow = (title, sub, on, locked) => `
  <div style="display: flex; align-items: center; gap: 12px; padding: 13px 0; border-top: 1px solid var(--border-default);">
    <div style="flex: 1;"><div style="font: 500 14.5px/19px 'Instrument Sans', sans-serif;">${title}</div>
    <div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary);">${sub}</div></div>
    <button class="fc-toggle ${on ? "is-on" : ""} ${locked ? "is-disabled" : ""}"></button>
  </div>`;
const w6 = `<div class="shell">${sidenav("Policies")}<main class="main">
  <div class="main-head"><h1>Policies</h1><div style="margin-left: auto;"><button class="fc-btn fc-btn--secondary"><i data-lucide="plus"></i>New policy</button></div></div>
  <div style="display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start;">
    <div style="display: flex; flex-direction: column; gap: 10px;">
      ${[["Lecture", "Notes, Camera, Calculator · used by 3 classes", true], ["Quiz", "no extras · used by 2 classes", false], ["Lab", "Camera, Safari · used by 1 class", false]].map(([n, s, on]) => `
      <div class="wcard" style="padding: 14px 16px; ${on ? "box-shadow: var(--focus-ring);" : ""}">
        <div style="font: 600 15px/20px 'Instrument Sans', sans-serif;">${n}</div>
        <div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary); margin-top: 2px;">${s}</div>
      </div>`).join("")}
    </div>
    <div class="wcard" style="max-width: 620px;">
      <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 14px;">
        <input class="fc-input" value="Lecture" style="font-weight: 600; width: 240px;">
        <span style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary); margin-left: auto;">Used by 3 classes</span>
      </div>
      ${togglerow("Phone", "Always available — calls can't be shielded", true, true)}
      ${togglerow("Messages", "Recommended on for family reachability", true)}
      <div style="padding: 14px 0; border-top: 1px solid var(--border-default);">
        <div style="font: 500 14.5px/19px 'Instrument Sans', sans-serif; margin-bottom: 10px;">Also allowed</div>
        <div style="display: flex; gap: 8px; flex-wrap: wrap; align-items: center;">
          <span class="fc-tag">Notes <button><i data-lucide="x"></i></button></span>
          <span class="fc-tag">Camera <button><i data-lucide="x"></i></button></span>
          <span class="fc-tag">Calculator <button><i data-lucide="x"></i></button></span>
          <input class="fc-input" placeholder="Add an app…" style="width: 130px; padding: 5px 10px; font-size: 13px;">
        </div>
        <div style="font: 400 12.5px/18px 'Instrument Sans', sans-serif; color: var(--text-tertiary); margin-top: 10px;">Students pick the matching apps on their own phones — Bali never sees anyone's app list.</div>
      </div>
      <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-default); padding-top: 14px;">
        <button class="fc-btn fc-btn--primary" style="padding: 9px 22px;">Save changes</button>
        <div style="text-align: right;">
          <button class="fc-btn fc-btn--ghost" style="color: var(--red-600);">Delete policy…</button>
          <div style="font: 400 11.5px/15px 'Instrument Sans', sans-serif; color: var(--text-tertiary);">In use — detach from 3 classes first</div>
        </div>
      </div>
    </div>
  </div>
</main></div>`;

/* ---------- W7 TAGS ---------- */
const tagCard = (label, code, cls, active) => `
  <div class="wcard" style="width: 268px; display: flex; flex-direction: column; gap: 12px; ${active ? "" : "opacity: 0.62;"}">
    <div class="fc-qr" style="width: 170px; height: 170px; align-self: center;">QR — print-ready<br>${code}</div>
    <div>
      <div style="font: 600 16px/21px 'Instrument Sans', sans-serif;">${label}</div>
      <div style="font: 500 11.5px/16px var(--font-mono); letter-spacing: 0.08em; color: var(--text-tertiary); margin-top: 3px;">${code} · ${cls}</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--border-default); padding-top: 12px;">
      <span style="font: 500 13.5px/18px 'Instrument Sans', sans-serif; flex: 1;">${active ? "Active" : "Deactivated"}</span>
      <button class="fc-toggle ${active ? "is-on" : ""}"></button>
    </div>
    <button class="fc-btn fc-btn--secondary" style="width: 100%;"><i data-lucide="printer"></i>Print sheet</button>
  </div>`;
const w7 = `<div class="shell">${sidenav("Tags")}<main class="main">
  <div class="main-head">
    <div><h1>Desk tags</h1><div class="meta">NFC tags + printable QR — students tap either to start focus</div></div>
    <div style="margin-left: auto;"><button class="fc-btn fc-btn--primary"><i data-lucide="plus"></i>New tag</button></div>
  </div>
  <div style="display: flex; gap: 16px; flex-wrap: wrap;">
    ${tagCard("Front desk", "T7XK2M9QPF", "Period 3 — Algebra II", true)}
    ${tagCard("Lab door", "T2RV8N4WLD", "Period 3 — Algebra II", true)}
    ${tagCard("Old tag — Sept", "T9QA1C6XSE", "Period 1 — Algebra I", false)}
  </div>
  <div style="font: 400 13px/19px 'Instrument Sans', sans-serif; color: var(--text-secondary); max-width: 640px;">
    Turning a tag off warns first: <i>"Every printed copy of this tag stops working immediately. Students can still join by code."</i> Writing the NFC side happens on your iPhone (Tags → Write) — the web prints the QR sheets.
  </div>
</main></div>`;

document.getElementById("frames").innerHTML = [
  frame("W5 · /app/classes/[id]/roster", "members + pending queue + join code", "<b>Approval queue floats above the table</b> in the warm family (action needed, nothing wrong). Member rows reuse the exact StatusChip mini states; Remove is a quiet ghost with a confirm.", w5),
  frame("W6 · /app/policies", "list + PolicyEditor", "Phone is informational and locked-on — honesty about what shielding can't touch. The device-mapping explainer sits with the tag input, where the misunderstanding would happen. Delete is guarded while in use.", w6),
  frame("W7 · /app/tags", "TagCard grid", "Print-ready QR placeholder (real render ships as SVG at 600dpi). Deactivated tags stay visible but dimmed — history, not mystery. The deactivation warning names the blast radius: all printed copies.", w7),
].join("");
if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.75 } });
</script>
</body>
</html>
