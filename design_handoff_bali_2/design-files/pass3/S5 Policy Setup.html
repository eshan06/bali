<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — S5 · Policy Setup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function Intro({ children }) {
  return (
    <React.Fragment>
      <div className="spacer" style={{ minHeight: 100 }} />
      <div className="safe vstack" style={{ gap: 20, alignItems: "center", textAlign: "center" }}>
        <Icon name="list-checks" size={42} color="var(--green-300)" />
        <div className="t-title1" style={{ maxWidth: 330 }}>One-time setup for Ms. Rivera's policy</div>
        <div className="t-body sec" style={{ maxWidth: 320 }}>
          This policy allows <b style={{ color: "var(--text-primary)" }}>Notes, Camera, Calculator</b>. iOS keeps your app list private, so you pick the matching apps yourself:
        </div>
        <AppsRow apps={[["notebook-pen", "Notes"], ["camera", "Camera"], ["calculator", "Calculator"]]} size={48} />
      </div>
      <div className="spacer" />
      <div className="safe vstack" style={{ paddingBottom: 48, gap: 10 }}>
        <BigButton>Select apps on my phone</BigButton>
        <div className="t-footnote ter" style={{ textAlign: "center" }}>Opens the iOS app picker. Bali never sees the list.</div>
      </div>
      {children}
    </React.Fragment>
  );
}

/* Apple's FamilyActivityPicker — rendered as the system surface it is */
function PickerSheet() {
  const row = (tint, name, checked, last) => (
    <div key={name} style={{ display: "flex", alignItems: "center", minHeight: 52, padding: "0 16px", position: "relative", fontFamily: "-apple-system, system-ui", fontSize: 17 }}>
      <div style={{
        width: 22, height: 22, borderRadius: "50%", marginRight: 12, flexShrink: 0,
        border: checked ? "none" : "1.5px solid rgba(235,235,245,0.3)",
        background: checked ? "#0A84FF" : "transparent",
        display: "flex", alignItems: "center", justifyContent: "center",
      }}>{checked && <Icon name="check" size={13} color="#fff" />}</div>
      <div style={{ width: 30, height: 30, borderRadius: 7, background: tint, marginRight: 12, flexShrink: 0 }}></div>
      <div style={{ color: "#fff", flex: 1 }}>{name}</div>
      {!last && <div style={{ position: "absolute", bottom: 0, right: 0, left: 76, height: 0.5, background: "rgba(84,84,88,0.65)" }}></div>}
    </div>
  );
  return (
    <React.Fragment>
      <div className="dim"></div>
      <div className="native-sheet" style={{ background: "#1C1C1E", height: 620, padding: "10px 0 30px" }}>
        <div className="grabber" style={{ background: "rgba(235,235,245,0.3)" }}></div>
        <div style={{ display: "flex", alignItems: "center", padding: "4px 16px 12px", fontFamily: "-apple-system, system-ui" }}>
          <span style={{ color: "#0A84FF", fontSize: 17 }}>Cancel</span>
          <span style={{ flex: 1, textAlign: "center", color: "#fff", fontSize: 17, fontWeight: 600 }}>Choose Activities</span>
          <span style={{ color: "#0A84FF", fontSize: 17, fontWeight: 600 }}>Done</span>
        </div>
        <div style={{ margin: "0 16px 14px", background: "rgba(118,118,128,0.24)", borderRadius: 10, height: 36, display: "flex", alignItems: "center", padding: "0 10px", gap: 6 }}>
          <Icon name="search" size={15} color="rgba(235,235,245,0.6)" />
          <span style={{ fontFamily: "-apple-system, system-ui", fontSize: 17, color: "rgba(235,235,245,0.6)" }}>Search</span>
        </div>
        <div style={{ fontFamily: "-apple-system, system-ui", fontSize: 13, color: "rgba(235,235,245,0.6)", textTransform: "uppercase", padding: "6px 32px 6px" }}>Apps</div>
        <div style={{ background: "#2C2C2E", borderRadius: 12, margin: "0 16px", overflow: "hidden" }}>
          {row("#8E8E93", "Calculator", true)}
          {row("#5E5CE6", "Camera", true)}
          {row("#FF9F0A", "Notes", true)}
          {row("#30D158", "Fitness", false)}
          {row("#FF375F", "Music", false)}
          {row("#64D2FF", "Weather", false, true)}
        </div>
      </div>
    </React.Fragment>
  );
}

function Return({ mismatch }) {
  return (
    <React.Fragment>
      <div className="spacer" style={{ minHeight: 100 }} />
      <div className="safe vstack" style={{ gap: 20, alignItems: "center", textAlign: "center" }}>
        <Icon name={mismatch ? "scan-eye" : "circle-check"} size={42} color={mismatch ? "var(--orange-300)" : "var(--green-300)"} />
        <div className="t-title1" style={{ maxWidth: 320 }}>{mismatch ? "You picked 2 apps" : "You picked 3 apps"}</div>
        <div className="t-body sec" style={{ maxWidth: 320 }}>
          {mismatch
            ? <span>The policy lists <b style={{ color: "var(--text-primary)" }}>3</b> — Notes, Camera, Calculator. We can't see which apps you chose, so double-check your picks match the list.</span>
            : "iOS will keep exactly these available during focus."}
        </div>
        <AppsRow apps={[["notebook-pen", "Notes"], ["camera", "Camera"], ["calculator", "Calculator"]]} size={44} />
      </div>
      <div className="spacer" />
      <div className="safe vstack" style={{ paddingBottom: 48, gap: 10 }}>
        {mismatch && <BigButton kind="secondary">Re-open picker</BigButton>}
        <BigButton>{mismatch ? "Looks right — confirm" : "Confirm"}</BigButton>
      </div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet num="S5" title="Policy Setup" here="S5"
      intro="One-time per policy. The honesty constraint shapes this whole flow: iOS never tells Bali which apps a student selected, so the design says that out loud and hands verification to the student — including a calm mismatch notice when the count looks off.">
      <div className="frames">
        <Frame label="S5.1 · The ask" note={<span>The policy's names are restated with the same generic glyphs used everywhere — never fake app icons. The button names the outcome.</span>}>
          <Intro />
        </Frame>
        <Frame label="S5.2 · Native FamilyActivityPicker" note={<span><b>Apple's sheet, untouched</b> — system dark list, system blue checks. We design around it, not over it.</span>}>
          <Intro><PickerSheet /></Intro>
        </Frame>
        <Frame label="S5.3 · Return — count mismatch" note={<span><b>Honest mismatch:</b> we know the count (3 expected, 2 chosen), not the contents. The student stays the authority; both paths are offered without alarm.</span>}>
          <Return mismatch />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
