<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — S10 · Shield Screen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* Apple ShieldConfiguration primitives ONLY:
   blur style + tint, one icon, title (text+color), subtitle (text+color),
   primary button (label + bg color), secondary button label. Nothing else. */
function Shield({ lightWalls = false }) {
  const wall = lightWalls
    ? "radial-gradient(circle at 30% 20%, #B9C6BD 0%, #8FA098 55%, #6E8077 100%)"
    : "radial-gradient(circle at 30% 20%, #233029 0%, #15201A 55%, #0D1511 100%)";
  return (
    <div style={{ position: "absolute", inset: 0, background: wall }}>
      {/* simulated blurred wallpaper behind the material */}
      <div style={{ position: "absolute", inset: 0, backdropFilter: "blur(40px)", background: lightWalls ? "rgba(244,243,240,0.55)" : "rgba(13,18,15,0.62)" }}></div>
      <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", padding: "0 36px", textAlign: "center", fontFamily: "-apple-system, system-ui" }}>
        <div style={{ flex: 1.2 }}></div>
        {/* ONE icon image */}
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none">
          <circle cx="32" cy="32" r="24" stroke={lightWalls ? "#5B6B61" : "#3D4F45"} strokeWidth="8"></circle>
          <path d="M 32 8 A 24 24 0 1 1 11.2 44" stroke={lightWalls ? "#2C6F51" : "#62A483"} strokeWidth="8" strokeLinecap="round"></path>
        </svg>
        {/* title text+color */}
        <div style={{ fontSize: 22, lineHeight: "28px", fontWeight: 600, color: lightWalls ? "#211F1B" : "#F1EFEB", marginTop: 22 }}>
          Focused with Ms. Rivera
        </div>
        {/* subtitle text+color */}
        <div style={{ fontSize: 15, lineHeight: "21px", color: lightWalls ? "#5B564E" : "#B0AAA1", marginTop: 8, maxWidth: 270 }}>
          Until 10:45 · Emergency? Open Bali
        </div>
        <div style={{ flex: 1 }}></div>
        {/* primary button: label + bg color */}
        <div style={{ width: "100%", maxWidth: 280, padding: "15px 0", borderRadius: 14, background: "#2C6F51", color: "#fff", fontSize: 17, fontWeight: 600 }}>OK</div>
        {/* secondary button: label only */}
        <div style={{ padding: "16px 0 0", color: lightWalls ? "#2C6F51" : "#92C3A9", fontSize: 17, fontWeight: 600 }}>Open Bali</div>
        <div style={{ height: 64 }}></div>
      </div>
    </div>
  );
}

function App() {
  return (
    <Sheet num="S10" title="Shield Screen" here="S10"
      intro="What a student sees when they open a shielded app mid-session. Apple's ShieldConfiguration API allows exactly six knobs — blur+tint, one icon, title, subtitle, primary button, secondary button label — and this design uses only those. No fake countdown ring, no custom layout: the arc appears as the static icon mark, and the subtitle carries the one thing that matters: the emergency path.">
      <div className="frames">
        <Frame label="S10 · Shield — dark wallpaper" note={<span><b>Within the primitives:</b> dark material blur with the brand's green-tinted darkness; arc mark as the single icon; "OK" returns to Home, "Open Bali" deep-links to S6 where the unlock lives. The subtitle names the emergency path — the shield never traps.</span>}>
          <Shield />
        </Frame>
        <Frame label="S10 · Shield — light wallpaper" light note={<span>Same six primitives over a light wallpaper: tint stays in the warm-neutral family, title/subtitle colors flip to the light-mode ink. Buttons keep the same evergreen — the one brand constant.</span>}>
          <Shield lightWalls />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
