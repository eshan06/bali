<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — S4 · Tap-In Confirmation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function TapIn({ offline = false }) {
  return (
    <React.Fragment>
      <div className="spacer" style={{ minHeight: 110 }} />
      <div className="safe vstack" style={{ gap: 8, alignItems: "center", textAlign: "center" }}>
        {offline && (
          <span className="fc-chip fc-chip--mini is-focused" style={{ marginBottom: 14 }}>
            <Icon name="wifi-off" size={13} /><span className="lbl">Verified offline — your tap still counts</span>
          </span>
        )}
        <div className="t-subhead sec">You tapped into</div>
        <div className="t-title1" style={{ maxWidth: 320 }}>Period 3 — Algebra II</div>
        <div className="t-title2 sec" style={{ fontWeight: 400 }}>until 10:45</div>
        <div style={{ marginTop: 34 }}>
          <AppsRow size={48} />
        </div>
        <div className="t-footnote ter" style={{ marginTop: 10 }}>These stay available. Everything else rests.</div>
      </div>
      <div className="spacer" />
      <div className="safe vstack" style={{ paddingBottom: 48, gap: 10 }}>
        <BigButton>Start Focus</BigButton>
        <div className="t-footnote ter" style={{ textAlign: "center" }}>Ends at the bell — or instantly with Emergency Unlock.</div>
      </div>
    </React.Fragment>
  );
}

function Variant({ icon, title, body, cta, ctaKind = "secondary", chip }) {
  return (
    <React.Fragment>
      <div className="spacer" style={{ minHeight: 140 }} />
      <div className="safe vstack" style={{ gap: 20, alignItems: "center", textAlign: "center" }}>
        <Icon name={icon} size={44} color="var(--text-tertiary)" />
        <div className="t-title1" style={{ maxWidth: 300 }}>{title}</div>
        <div className="t-body sec" style={{ maxWidth: 304 }}>{body}</div>
        {chip}
      </div>
      <div className="spacer" />
      <div className="safe vstack" style={{ paddingBottom: 48, gap: 10 }}>
        <BigButton kind={ctaKind}>{cta}</BigButton>
      </div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet num="S4" title="Tap-In Confirmation" here="S4"
      intro="The breath before focus. One screen, one decision, generous space: the class, the end time, what stays available — then Start Focus. A student who needs PolicySetup first is routed to S5 before ever seeing this screen.">
      <div className="frames">
        <Frame label="S4.1 · Ready to start" note={<span><b>Informed, then committed:</b> the allowed apps are restated at the moment of commitment, mirroring S2's preview. Tapping Start triggers the one theatrical moment (S6 arc draw-in).</span>}>
          <TapIn />
        </Frame>
        <Frame label="S4.2 · Verified offline" note={<span>Tag taps verify cryptographically without network — the chip says so plainly. Status syncs to the teacher when the connection returns.</span>}>
          <TapIn offline />
        </Frame>
        <Frame label="S4.3 · Not a member" note={<span>The tag knows its class; joining is one step away and the code is prefilled from the tag.</span>}>
          <Variant icon="user-plus" title="This tag belongs to Period 3 — Algebra II"
            body="You're not in this class yet. Join it first — the code's already filled in."
            cta="Join Period 3 — Algebra II" ctaKind="primary" />
        </Frame>
        <Frame label="S4.4 · Session not started" note={<span>Early tap = no error, just timing. The screen offers to do the right thing when the session begins.</span>}>
          <Variant icon="clock" title="Ms. Rivera hasn't started a session"
            body="You're early. Focus begins when the session does — we can start you automatically."
            cta="Start my focus when the session starts" ctaKind="primary" />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
