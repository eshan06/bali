<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — S7–S9 · Post-Emergency, History, Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- S7 ---------- */
function PostEmergency() {
  const chip = (label) => (
    <div key={label} style={{
      flex: "1 1 30%", minWidth: 96, padding: "13px 0", textAlign: "center",
      background: "var(--surface-raised)", border: "1px solid var(--border-strong)",
      borderRadius: 14, fontSize: 16, fontWeight: 600, color: "var(--text-primary)",
    }}>{label}</div>
  );
  return (
    <React.Fragment>
      {/* dimmed S3-unlocked behind */}
      <div className="safe vstack" style={{ paddingTop: 84, gap: 16, filter: "blur(1px)", opacity: 0.5 }}>
        <div className="t-lgtitle">Today</div>
        <div className="fc-banner is-unlocked" style={{ borderRadius: 20 }}>
          <div className="b-lead"><Icon name="lock-open" size={18} /></div>
          <div><div className="b-title">Unlocked — focus when ready</div><div className="b-sub">Ms. Rivera was notified</div></div>
        </div>
      </div>
      <div className="dim" style={{ background: "rgba(0,0,0,0.5)" }}></div>
      <div className="native-sheet" style={{ gap: 0 }}>
        <div className="grabber"></div>
        <div className="t-title2" style={{ textAlign: "center" }}>You're unlocked. Everything OK?</div>
        <div className="t-subhead sec" style={{ textAlign: "center", marginTop: 6 }}>Sharing a reason is optional — it goes only to Ms. Rivera.</div>
        <div className="hstack" style={{ flexWrap: "wrap", gap: 10, marginTop: 22 }}>
          {["Family", "Medical", "Safety"].map((l) => chip(l))}
          {["Other", "Skip"].map((l) => chip(l))}
        </div>
        <div className="t-footnote ter" style={{ textAlign: "center", marginTop: 20 }}>Ms. Rivera was notified.</div>
      </div>
    </React.Fragment>
  );
}

/* ---------- S8 ---------- */
function WeekBar({ day, mins, max = 120, today }) {
  return (
    <div className="hstack" style={{ gap: 12 }}>
      <span className="t-footnote ter" style={{ width: 34, fontWeight: today ? 600 : 400, color: today ? "var(--text-primary)" : undefined }}>{day}</span>
      <div style={{ flex: 1, height: 16, borderRadius: 5, background: "var(--surface-sunken)", overflow: "hidden" }}>
        <div style={{ width: (mins / max) * 100 + "%", height: "100%", borderRadius: 5, background: today ? "var(--green-400)" : "var(--green-700)" }}></div>
      </div>
      <span className="t-footnote sec" style={{ width: 52, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{mins} min</span>
    </div>
  );
}
function History({ detail = false }) {
  if (detail) {
    return (
      <React.Fragment>
        <div className="safe vstack" style={{ paddingTop: 84, gap: 4 }}>
          <div className="hstack" style={{ gap: 8 }}>
            <Icon name="chevron-left" size={20} color="var(--text-brand)" />
            <span className="t-subhead" style={{ color: "var(--text-brand)" }}>History</span>
          </div>
          <div className="t-title1" style={{ marginTop: 12 }}>Tuesday, June 9</div>
          <div className="t-subhead sec">Period 3 — Algebra II · 41 focused minutes</div>
          <div style={{ background: "var(--surface-card)", borderRadius: 20, padding: 20, marginTop: 20 }}>
            <div className="fc-timeline">
              <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Tapped in<small>via desk tag</small></div><div className="when">10:02</div></div>
              <div className="ev is-emergency"><div className="dot"><Icon name="lock-open" size={13} /></div><div className="what">Emergency Unlock<small>reason: skipped</small></div><div className="when">10:31</div></div>
              <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Re-focused</div><div className="when">10:35</div></div>
              <div className="ev"><div className="dot"><Icon name="flag" size={13} /></div><div className="what">Session ended at the bell</div><div className="when">10:45</div></div>
            </div>
          </div>
          <div className="t-footnote ter" style={{ marginTop: 14, maxWidth: 320 }}>Only you see this page. Teachers see session status, never this history.</div>
        </div>
        <div className="spacer" />
      </React.Fragment>
    );
  }
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 18 }}>
        <div className="t-lgtitle">History</div>
        <div style={{ background: "var(--surface-card)", borderRadius: 20, padding: 20 }} className="vstack">
          <div className="hstack">
            <div className="t-headline">This week</div>
            <div className="spacer" />
            <span className="t-footnote sec" style={{ fontVariantNumeric: "tabular-nums" }}>3h 12m focused</span>
          </div>
          <div className="vstack" style={{ gap: 9, marginTop: 16 }}>
            <WeekBar day="Mon" mins={88} />
            <WeekBar day="Tue" mins={41} />
            <WeekBar day="Wed" mins={63} />
            <WeekBar day="Thu" mins={0} />
            <WeekBar day="Fri" mins={37} today />
          </div>
        </div>
        <div className="fc-banner" style={{ borderRadius: 16 }}>
          <Icon name="flame" size={20} color="var(--green-300)" />
          <div className="t-subhead">4 school days in a row with a full session</div>
        </div>
        <div className="t-footnote ter" style={{ textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600 }}>Sessions</div>
        <div className="vstack" style={{ gap: 10 }}>
          {[["Fri · Period 3 — Algebra II", "37 min · 1 unlock"], ["Wed · Period 5 — Chemistry", "45 min"], ["Wed · Period 3 — Algebra II", "18 min · joined late"]].map(([t, s]) => (
            <div className="fc-banner" style={{ borderRadius: 16, padding: "12px 16px" }} key={t}>
              <div><div className="t-subhead" style={{ fontWeight: 600 }}>{t}</div><div className="t-footnote ter" style={{ marginTop: 1 }}>{s}</div></div>
              <div className="spacer" />
              <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />
            </div>
          ))}
        </div>
      </div>
      <div className="spacer" />
    </React.Fragment>
  );
}

/* ---------- S9 ---------- */
function Row({ icon, title, detail, color, last }) {
  return (
    <div className="hstack" style={{ gap: 12, minHeight: 50, padding: "0 16px", position: "relative" }}>
      <Icon name={icon} size={19} color={color || "var(--text-secondary)"} />
      <span className="t-body">{title}</span>
      <div className="spacer" />
      {detail && <span className="t-subhead ter">{detail}</span>}
      <Icon name="chevron-right" size={15} color="var(--text-tertiary)" />
      {!last && <div style={{ position: "absolute", bottom: 0, left: 47, right: 0, height: 0.5, background: "var(--border-default)" }}></div>}
    </div>
  );
}
function Group({ children, style = {} }) {
  return <div style={{ background: "var(--surface-card)", borderRadius: 16, overflow: "hidden", ...style }}>{children}</div>;
}
function Settings({ privacy = false }) {
  if (privacy) {
    return (
      <React.Fragment>
        <div className="safe vstack" style={{ paddingTop: 84, gap: 16 }}>
          <div className="hstack" style={{ gap: 8 }}>
            <Icon name="chevron-left" size={20} color="var(--text-brand)" />
            <span className="t-subhead" style={{ color: "var(--text-brand)" }}>Settings</span>
          </div>
          <div className="t-lgtitle">Privacy</div>
          <div className="t-body sec">The contract from day one — unchanged.</div>
          <Group style={{ padding: 20 }}>
            <div className="t-footnote" style={{ fontWeight: 600, color: "var(--green-300)", textTransform: "uppercase", letterSpacing: "0.05em", marginBottom: 12 }}>Your teacher sees</div>
            <div className="vstack t-subhead" style={{ gap: 9 }}>
              <span>· Your focus status (focused, on a pass, unlocked)</span>
              <span>· When you tap in and out</span>
              <span>· When you unlock, and the reason if you share one</span>
            </div>
            <div className="t-footnote" style={{ fontWeight: 600, color: "var(--text-tertiary)", textTransform: "uppercase", letterSpacing: "0.05em", margin: "18px 0 12px" }}>Never sees</div>
            <div className="vstack t-subhead sec" style={{ gap: 9 }}>
              <span>· Your screen or what's on it</span>
              <span>· Your apps, messages, or browsing</span>
              <span>· Your location</span>
            </div>
          </Group>
          <div className="t-footnote ter" style={{ maxWidth: 330 }}>Shielding runs through Apple's Screen Time on your phone. You can revoke it in iOS Settings at any time — your teacher would simply see "permission off."</div>
        </div>
        <div className="spacer" />
      </React.Fragment>
    );
  }
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 16 }}>
        <div className="t-lgtitle">Settings</div>
        <div className="fc-permrow is-ok" style={{ borderRadius: 16 }}>
          <Icon name="shield-check" size={20} />
          <div><div className="p-title" style={{ fontWeight: 600, fontSize: 15 }}>Screen Time is on</div><div className="p-sub" style={{ fontSize: 13 }}>Everything's ready for the next session.</div></div>
        </div>
        <Group>
          <Row icon="user" title="Account" detail="Jordan Park" />
          <Row icon="lock" title="Privacy" last />
        </Group>
        <Group>
          <Row icon="users" title="Period 3 — Algebra II" detail="Ms. Rivera" />
          <Row icon="users" title="Period 5 — Chemistry" detail="Mr. Okafor" />
          <Row icon="users" title="Period 7 — English 11" detail="Mrs. Liang" last />
        </Group>
        <div className="t-footnote ter" style={{ paddingLeft: 4 }}>Tap a class to see its policy or leave it.</div>
        <Group>
          <Row icon="info" title="About Bali" detail="1.0" last />
        </Group>
      </div>
      <div className="spacer" />
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet num="S7–S9" title="Post-Emergency · History · Settings" here="S7–S9"
      intro="S7 is the gentlest screen in the app: one optional tap, Skip as a first-class equal, zero guilt styling. S8 keeps history personal-only — no comparisons, no leaderboards. S9 is a fast form with the privacy contract restated verbatim.">
      <div className="frames">
        <Frame label="S7 · Post-emergency sheet" note={<span><b>Equal weight by design:</b> all five chips share one size and style — Skip is not smaller, grayer, or last-moment. One tap dismisses. The notified line is below the fold of attention, stated once.</span>}>
          <PostEmergency />
        </Frame>
        <Frame label="S8.1 · History" note={<span>Personal-only: minutes this week, a quiet streak, sessions. No class averages, no rank, nothing grades-adjacent. "1 unlock" is logged factually, never flagged.</span>}>
          <History />
        </Frame>
        <Frame label="S8.2 · Session detail" note={<span>The EventTimeline from the component sheet, student-side. The footer restates who can see this page: only the student.</span>}>
          <History detail />
        </Frame>
        <Frame label="S9.1 · Settings" note={<span>Permission health lives at the top in its ok state — quiet green, reassurance not celebration. Leave-class is inside each class page, one level down, not hidden.</span>}>
          <Settings />
        </Frame>
        <Frame label="S9.2 · Privacy page" note={<span>The S1 card-2 contract restated word-for-word, plus the honest revocation note — we tell students they can turn it off and what the teacher would see.</span>}>
          <Settings privacy />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
