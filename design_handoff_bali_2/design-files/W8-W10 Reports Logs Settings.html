<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — W8–W10 · Reports, Logs, Settings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens/tokens.css">
<link rel="stylesheet" href="pass2/components.css">
<link rel="stylesheet" href="pass3/sheet.css">
<link rel="stylesheet" href="pass4/web.css">
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<style>.sheet { max-width: 1500px; }</style>
</head>
<body>
<div class="sheet">
  <header class="masthead" data-screen-label="Pass 4 — W8–W10">
    <div class="kicker">
      <svg class="arc-mark" viewBox="0 0 20 20" fill="none" aria-hidden="true"><circle cx="10" cy="10" r="7.5" stroke="var(--stone-200)" stroke-width="3"></circle><path d="M 10 2.5 A 7.5 7.5 0 1 1 3.5 13.75" stroke="var(--green-600)" stroke-width="3" stroke-linecap="round"></path></svg>
      Bali · Pass 4 of 4 · Web
    </div>
    <h1>W8–W10 · Reports · Logs · Settings</h1>
    <p>The reflective surfaces. W8 leads with the framing line as designed copy — pattern data is a conversation starter, never a verdict. W9 is the cross-class event stream; W10 is plain fast forms.</p>
    <nav class="crumbs">
      <a href="W4 Live Dashboard.html">W4</a>
      <a href="W1-W3 Login Fallback Classes.html">W1–W3</a>
      <a href="W5-W7 Roster Policies Tags.html">W5–W7</a>
      <a class="here" href="W8-W10 Reports Logs Settings.html">W8–W10</a>
      <a href="pass3/S6 Focus Active.html">iOS ↗</a>
      <a href="Bali - Landing.html">Landing ↗</a>
    </nav>
  </header>
  <div id="frames" style="display: flex; flex-direction: column; gap: 48px;"></div>
</div>

<script>
function sidenav(active) {
  const items = [["layout-grid", "Classes"], ["list-checks", "Policies"], ["nfc", "Tags"], ["chart-bar", "Reports"], ["scroll-text", "Logs"], ["settings", "Settings"]];
  return `<aside class="sidenav">
    <div class="brand"><svg viewBox="0 0 20 20" fill="none" style="width:18px;height:18px;"><circle cx="10" cy="10" r="7.5" stroke="var(--stone-200)" stroke-width="3"></circle><path d="M 10 2.5 A 7.5 7.5 0 1 1 3.5 13.75" stroke="var(--green-600)" stroke-width="3" stroke-linecap="round"></path></svg>Bali</div>
    ${items.map(([ic, l]) => `<a class="${l === active ? "on" : ""}" href="#"><i data-lucide="${ic}"></i>${l}</a>`).join("")}
    <div class="foot"><div class="ava">MR</div><div class="who">Ms. Rivera<small>Jefferson High</small></div></div>
  </aside>`;
}
function frame(label, sub, note, inner) {
  return `<div class="wframe-cell"><div class="wf-label">${label}${sub ? `<small>${sub}</small>` : ""}</div>
    <div class="wframe">${inner}</div>${note ? `<div class="wf-note">${note}</div>` : ""}</div>`;
}
const spark = (vals) => `<span class="spark">${vals.map(v => `<i style="height:${3 + v * 15}px; ${v === 0 ? "background: var(--stone-200);" : ""}"></i>`).join("")}</span>`;

/* ---------- W8 REPORTS ---------- */
const emRow = (when, who, reason, session, freq) => `
  <tr><td class="num">${when}</td><td><b>${who}</b></td>
  <td>${reason === "skipped" ? `<span style="color: var(--text-tertiary);">skipped</span>` : reason}</td>
  <td><span class="sub" style="display:inline;">${session}</span></td>
  <td>${spark(freq)}</td></tr>`;
const barRow = (label, mins, max) => `
  <div style="display: flex; align-items: center; gap: 12px;">
    <span style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-secondary); width: 150px;">${label}</span>
    <div style="flex: 1; height: 14px; border-radius: 4px; background: var(--surface-sunken); overflow: hidden;">
      <div style="width: ${(mins / max) * 100}%; height: 100%; background: var(--green-700); border-radius: 4px;"></div>
    </div>
    <span style="font: 500 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-secondary); width: 70px; text-align: right; font-variant-numeric: tabular-nums;">${mins} min avg</span>
  </div>`;
const w8 = `<div class="shell">${sidenav("Reports")}<main class="main">
  <div class="main-head">
    <div><h1>Reports</h1><div class="framing" style="margin-top: 4px;">Patterns are conversation starters, not verdicts.</div></div>
    <div style="margin-left: auto;"><button class="fc-btn fc-btn--secondary"><i data-lucide="download"></i>Export CSV</button></div>
  </div>
  <div class="filterchips">
    <button class="on">All classes</button><button>Period 3 — Algebra II</button><button>Period 1 — Algebra I</button><button>Period 6 — Geometry</button>
    <span style="flex: 1;"></span>
    <button>This week</button><button class="on">This month</button>
  </div>
  <div style="display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; align-items: start;">
    <div>
      <div class="wlabel" style="margin-bottom: 10px;">Emergency unlocks · 6 this month</div>
      <table class="wtable">
        <tr><th>When</th><th>Student</th><th>Reason</th><th>Session</th><th>Last 6 wks</th></tr>
        ${emRow("Jun 10 · 10:31", "Sam Torres", "skipped", "Period 3 — Algebra II", [0, 0, 0.3, 0, 0.3, 0.6])}
        ${emRow("Jun 8 · 1:40", "Rosa Vega", "Family", "Period 5 — Chemistry", [0, 0.3, 0, 0, 0, 0.3])}
        ${emRow("Jun 4 · 10:12", "Sam Torres", "Medical", "Period 3 — Algebra II", [0, 0, 0.3, 0, 0.3, 0.6])}
        ${emRow("May 28 · 2:55", "Kai Nakamura", "Other", "Period 7 — English 11", [0.3, 0, 0, 0, 0, 0.3])}
        ${emRow("May 27 · 10:30", "Sam Torres", "skipped", "Period 3 — Algebra II", [0, 0, 0.3, 0, 0.3, 0.6])}
      </table>
      <div style="font: 400 12.5px/18px 'Instrument Sans', sans-serif; color: var(--text-tertiary); margin-top: 10px;">A repeating sparkline is a nudge to check in privately — the export carries the same framing line in its header row.</div>
    </div>
    <div>
      <div class="wlabel" style="margin-bottom: 10px;">Focus minutes per session</div>
      <div class="wcard">
      <div style="display: flex; flex-direction: column; gap: 11px;">
        ${barRow("Period 3 — Algebra II", 41, 50)}
        ${barRow("Period 1 — Algebra I", 44, 50)}
        ${barRow("Period 5 — Chemistry", 38, 50)}
        ${barRow("Period 6 — Geometry", 46, 50)}
        ${barRow("Period 7 — English 11", 35, 50)}
      </div>
      <div style="font: 400 12.5px/18px 'Instrument Sans', sans-serif; color: var(--text-tertiary); margin-top: 16px;">Out of a 50-minute period. No per-student minute rankings exist anywhere — averages only.</div>
      </div>
    </div>
  </div>
</main></div>`;

/* ---------- W9 LOGS ---------- */
const logRow = (state, icon, what, sub, cls, when) => `
  <div class="ev is-${state}" style="padding-bottom: 16px;">
    <div class="dot"><i data-lucide="${icon}"></i></div>
    <div class="what">${what}<small>${sub} · ${cls}</small></div>
    <div class="when">${when}</div>
  </div>`;
const w9 = `<div class="shell">${sidenav("Logs")}<main class="main">
  <div class="main-head"><h1>Event log</h1><div class="meta" style="margin-left: 12px;">all classes · newest first</div></div>
  <div class="filterchips">
    <button class="on">All types</button><button>Emergencies</button><button>Passes</button><button>Permission</button><button>Sessions</button>
    <span style="flex: 1;"></span>
    <button class="on">All classes</button><button>Period 3</button><button>Period 5</button>
  </div>
  <div class="wcard" style="max-width: 720px; padding: 24px;">
    <div class="fc-timeline">
      ${logRow("emergency", "lock-open", "Sam Torres — Emergency Unlock", "reason pending", "Period 3 — Algebra II", "10:31 AM")}
      ${logRow("pass", "ticket", "Pass granted to Aisha Khan · 10 min", '"nurse"', "Period 3 — Algebra II", "10:14 AM")}
      ${logRow("revoked", "shield-off", "Diego Morales turned off Screen Time", "shields off", "Period 3 — Algebra II", "10:09 AM")}
      ${logRow("focused", "circle-check", "Session started · 26 tapped in within 4 min", "Lecture policy", "Period 3 — Algebra II", "10:00 AM")}
      ${logRow("focused", "flag", "Session ended at the bell", "44 min avg focus", "Period 1 — Algebra I", "Yesterday")}
    </div>
    <button class="fc-btn fc-btn--secondary" style="margin-top: 18px;">Load older events</button>
  </div>
</main></div>`;

/* ---------- W10 SETTINGS ---------- */
const w10 = `<div class="shell">${sidenav("Settings")}<main class="main">
  <div class="main-head"><h1>Settings</h1></div>
  <div style="display: flex; flex-direction: column; gap: 18px; max-width: 560px;">
    <div class="wcard" style="display: flex; flex-direction: column; gap: 12px;">
      <div class="wlabel">Profile</div>
      <div style="display: flex; gap: 12px;">
        <div style="flex: 1;"><div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-secondary); margin-bottom: 5px;">Name</div><input class="fc-input" style="width: 100%;" value="Maria Rivera"></div>
        <div style="flex: 1;"><div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-secondary); margin-bottom: 5px;">Shown to students as</div><input class="fc-input" style="width: 100%;" value="Ms. Rivera"></div>
      </div>
      <div><div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-secondary); margin-bottom: 5px;">School</div><input class="fc-input" style="width: 100%;" value="Jefferson High School"></div>
    </div>
    <div class="wcard" style="display: flex; flex-direction: column; gap: 4px;">
      <div class="wlabel" style="margin-bottom: 8px;">Email me about</div>
      ${[["Emergency unlocks", "always also on the dashboard", true], ["Permission turned off mid-session", "", true], ["Weekly summary", "Mondays, one email", false]].map(([t, s, on]) => `
      <div style="display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--border-default);">
        <div style="flex: 1;"><div style="font: 500 14.5px/19px 'Instrument Sans', sans-serif;">${t}</div>
        ${s ? `<div style="font: 400 12.5px/17px 'Instrument Sans', sans-serif; color: var(--text-tertiary);">${s}</div>` : ""}</div>
        <button class="fc-toggle ${on ? "is-on" : ""}"></button>
      </div>`).join("")}
    </div>
    <button class="fc-btn fc-btn--primary" style="align-self: flex-start; padding: 10px 24px;">Save changes</button>
  </div>
</main></div>`;

document.getElementById("frames").innerHTML = [
  frame("W8 · /app/reports", "framing line as designed copy", "The framing line is part of the page header, set in the italic body style — not a tooltip or afterthought. Sparklines use the warm emergency hue at low weight; red appears nowhere on this page. CSV export embeds the same framing line.", w8),
  frame("W9 · /app/logs", "cross-class event stream", "EventTimeline reused verbatim from the component sheet. Filters are flat chips, not dropdowns — one click to answer 'show me just emergencies.' Cursor pagination via 'Load older events.'", w9),
  frame("W10 · /app/settings", "plain fast forms", "Nothing clever: profile, school, three notification switches. 'Shown to students as' is the one field with product opinion — it's what every student screen prints.", w10),
].join("");
if (window.lucide) lucide.createIcons({ attrs: { "stroke-width": 1.75 } });
</script>
</body>
</html>
