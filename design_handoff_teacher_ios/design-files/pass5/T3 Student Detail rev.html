<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T3 rev · Student Detail (pattern, not just this moment)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="../pass3/sheet.css">
<link rel="stylesheet" href="pass5.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="../pass3/ios-frame.jsx"></script>
<script type="text/babel" src="../pass3/scaffold.jsx"></script>
<script type="text/babel" src="scaffold5.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
function GridBackdrop() {
  return (
    <div className="safe vstack" style={{ paddingTop: 74, gap: 12, filter: "blur(1px)", opacity: 0.45 }}>
      <div className="t-headline">Period 3 — Algebra II</div>
      <div className="t-footnote sec">23:14 · ends 10:45</div>
    </div>
  );
}

function HistoryRow({ day, what, state, icon, last = false }) {
  return (
    <div className="hstack" style={{ gap: 12, padding: "11px 0", position: "relative", minHeight: 46 }}>
      <span className="t-footnote sec" style={{ width: 38, flex: "none", fontWeight: 600 }}>{day}</span>
      <div style={{ width: 26, height: 26, borderRadius: 999, background: state ? `var(--state-${state}-bg)` : "var(--surface-sunken)", color: state ? `var(--state-${state}-fg)` : "var(--text-secondary)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none", border: state === "nodevice" ? "1.5px dashed var(--state-nodevice-fg)" : "none" }}>
        <Icon name={icon} size={13} />
      </div>
      <span className="t-subhead" style={{ flex: 1 }}>{what}</span>
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 38, right: 0 }}></div>}
    </div>
  );
}

function StudentDetailRev({ tab = "session" }) {
  return (
    <React.Fragment>
      <GridBackdrop />
      <div className="dim"></div>
      <div className="native-sheet" style={{ paddingBottom: 40 }}>
        <div className="grabber"></div>
        <div className="hstack" style={{ gap: 12 }}>
          <div>
            <div className="t-title2">Sam Torres</div>
            <div className="t-footnote sec" style={{ marginTop: 2 }}>tapped in 10:02 · iPhone</div>
          </div>
          <div className="spacer"></div>
          <Chip state="emergency" label="Unlocked" />
        </div>
        <div className="fc-seg" style={{ alignSelf: "stretch", display: "flex", marginTop: 14 }}>
          <button type="button" className={tab === "session" ? "is-active" : ""} style={{ flex: 1 }}>This session</button>
          <button type="button" className={tab === "recent" ? "is-active" : ""} style={{ flex: 1 }}>Recent</button>
        </div>
        {tab === "session" ? (
          <React.Fragment>
            <div style={{ background: "var(--surface-card)", borderRadius: 14, padding: 16, marginTop: 14 }}>
              <div className="fc-timeline">
                <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Tapped in</div><div className="when">10:02</div></div>
                <div className="ev is-emergency"><div className="dot"><Icon name="lock-open" size={13} /></div><div className="what">Emergency Unlock<small>reason pending</small></div><div className="when">10:31</div></div>
              </div>
            </div>
            <div className="t-footnote ter" style={{ textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600, margin: "18px 0 8px" }}>Grant a pass</div>
            <div className="vstack" style={{ gap: 10 }}>
              <div className="fc-seg" style={{ alignSelf: "stretch", display: "flex" }}>
                {["5 min", "10 min", "15 min", "Custom"].map((l, i) => (
                  <button key={l} type="button" className={i === 1 ? "is-active" : ""} style={{ flex: 1 }}>{l}</button>
                ))}
              </div>
              <input className="fc-input" placeholder="Reason (optional) — e.g. nurse" readOnly />
              <div className="fc-btn fc-btn--primary" style={{ padding: "12px 0" }}>Grant 10-minute pass</div>
              <span className="t-footnote ter">Shields return automatically when it ends.</span>
            </div>
            <div className="hstack" style={{ gap: 12, marginTop: 18, paddingTop: 16, borderTop: "1px solid var(--border-default)" }}>
              <div style={{ flex: 1 }}>
                <div className="t-subhead" style={{ fontWeight: 600 }}>No device today</div>
                <div className="t-footnote ter">Marks Sam out of today's grid only</div>
              </div>
              <button className="fc-toggle" aria-label="No device today, off"></button>
            </div>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div style={{ background: "var(--surface-card)", borderRadius: 14, padding: "4px 16px", marginTop: 14 }}>
              <HistoryRow day="Tue" what="Focused 41 min · 1 unlock, re-focused" state="emergency" icon="lock-open" />
              <HistoryRow day="Mon" what="Focused 47 min, full session" state="focused" icon="circle-check" />
              <HistoryRow day="Fri" what="Focused 39 min · 10-min pass" state="pass" icon="ticket" />
              <HistoryRow day="Wed" what="Permission off · rejoined 4 min later" state="revoked" icon="shield-off" />
              <HistoryRow day="Tue" what="No device that day" state="nodevice" icon="smartphone" last />
            </div>
            <div className="framing5" style={{ marginTop: 12 }}>Patterns are conversation starters, not verdicts.</div>
            <div className="t-footnote ter" style={{ marginTop: 8 }}>Session status only — Bali never sees Sam's screen, apps, messages, or location.</div>
          </React.Fragment>
        )}
      </div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet5 num="T3 · revised" title="Student Detail — pattern, not just this moment" here="T3 rev"
      intro="The brief's sheet showed only the current session. The revision adds one segmented control: This session (unchanged — timeline, GrantPassForm, no-device toggle) and Recent — the last five sessions as compact outcome rows, so a teacher can see a pattern before deciding to have a conversation. The framing line sits directly under the history, and there is deliberately nothing to drill into: no device contents exist.">
      <div className="frames">
        <Frame label="T3.1 · This session" sub="unchanged from the brief" light note={<span>Everything a teacher needs mid-lesson, exactly as designed: the story so far, the pass form with its auto-return promise, the no-device toggle. The only addition is the segmented control above the timeline.</span>}>
          <StudentDetailRev tab="session" />
        </Frame>
        <Frame label="T3.2 · Recent — last 5 sessions" light note={<span><b>Outcomes, stated factually:</b> each row is icon + label per §2 (grayscale-safe), durations and events without judgment — “1 unlock, re-focused,” never “violation.” Red appears once, on the revoked icon, because that's its state color. The closing footnote restates the privacy boundary where a teacher might wish for more: there is no more.</span>}>
          <StudentDetailRev tab="recent" />
        </Frame>
      </div>
    </Sheet5>
  );
}
mountSheet(App);
</script>
</body>
</html>
