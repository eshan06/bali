<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T6 · Class Detail (per-class hub)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="../pass3/sheet.css">
<link rel="stylesheet" href="pass5.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="../pass3/ios-frame.jsx"></script>
<script type="text/babel" src="../pass3/scaffold.jsx"></script>
<script type="text/babel" src="scaffold5.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- shared header + segments ---------- */
function T6Header({ live = false }) {
  return (
    <React.Fragment>
      <div className="hstack" style={{ gap: 5, color: "var(--text-brand)" }}>
        <Icon name="chevron-left" size={17} />
        <span className="t-subhead" style={{ color: "var(--text-brand)", fontWeight: 500 }}>Classes</span>
      </div>
      <div style={{ marginTop: 6 }}>
        <div className="t-title1">Period 3 — Algebra II</div>
        <div className="t-footnote sec" style={{ marginTop: 3 }}>MWF · 9:50–10:45 · 28 students</div>
      </div>
      <div className="hstack" style={{ gap: 8, marginTop: 12 }}>
        <div className="hstack" style={{ gap: 8, background: "var(--surface-sunken)", border: "1px solid var(--border-default)", borderRadius: 10, padding: "9px 13px", minHeight: 44 }}>
          <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600, fontSize: 15, letterSpacing: "0.12em", color: "var(--text-primary)" }}>KM3W7Q2A</span>
          <Icon name="qr-code" size={15} color="var(--text-tertiary)" />
        </div>
        <div className="fc-btn fc-btn--primary" style={{ flex: 1, padding: "11px 0", fontSize: 16 }}>
          {live ? "Open live grid" : <React.Fragment><Icon name="play" size={15} />Start session</React.Fragment>}
        </div>
      </div>
    </React.Fragment>
  );
}

function LiveBanner() {
  return (
    <div className="fc-banner" style={{ border: "1.5px solid var(--green-200)", marginTop: 12 }}>
      <Arc size={36} stroke={4.5} pct={0.466} />
      <div style={{ flex: 1 }}>
        <div className="b-title" style={{ fontSize: 15, lineHeight: "20px" }}>
          <span className="hstack" style={{ gap: 7, display: "inline-flex" }}><LiveDot />Live · 23:14 · ends 10:45</span>
        </div>
        <div className="b-sub">22 focused · 1 unlocked · 1 pass</div>
      </div>
      <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />
    </div>
  );
}

function Seg({ active }) {
  return (
    <div className="seg5" style={{ marginTop: 14 }}>
      {["Overview", "Roster", "Policy", "Tags", "Activity"].map((l) => (
        <button key={l} type="button" className={l === active ? "is-active" : ""}>{l}</button>
      ))}
    </div>
  );
}

function T6Screen({ tab, live = false, xl = false, children }) {
  return (
    <div className={"safe vstack" + (xl ? " xl" : "")} style={{ paddingTop: 70, paddingBottom: 28 }}>
      <T6Header live={live} />
      {live && <LiveBanner />}
      <Seg active={tab} />
      <div className="vstack" style={{ gap: 12, marginTop: 14 }}>{children}</div>
    </div>
  );
}

/* ---------- Overview ---------- */
function Overview() {
  return (
    <React.Fragment>
      <div className="statgrid">
        <div className="stat"><div className="num">28</div><div className="lbl">members</div></div>
        <div className="stat"><div className="num">4</div><div className="lbl">sessions this week</div></div>
        <div className="stat"><div className="num">47 min</div><div className="lbl">last session · Tue</div></div>
        <div className="stat"><div className="num">41 min</div><div className="lbl">median focus per session</div></div>
      </div>
      <div className="t-footnote ter">Focus minutes count time in session — nothing else is measured.</div>
      <Card5>
        <div className="hstack" style={{ gap: 12, padding: "12px 16px", position: "relative", minHeight: 48 }}>
          <Icon name="flag" size={18} color="var(--text-secondary)" />
          <div style={{ flex: 1 }}>
            <div className="t-subhead" style={{ fontWeight: 600 }}>Last session recap</div>
            <div className="t-footnote ter">Tue · 47 min · 26 of 28 focused</div>
          </div>
          <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />
          <div className="sep" style={{ position: "absolute", bottom: 0, left: 46, right: 0 }}></div>
        </div>
        <div className="hstack" style={{ gap: 12, padding: "12px 16px", minHeight: 48 }}>
          <Icon name="pencil" size={18} color="var(--text-secondary)" />
          <div style={{ flex: 1 }}>
            <div className="t-subhead" style={{ fontWeight: 600 }}>Edit class</div>
            <div className="t-footnote ter">Name, schedule, auto-approve, default policy</div>
          </div>
          <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />
        </div>
      </Card5>
    </React.Fragment>
  );
}

/* ---------- Roster ---------- */
function ApprovalRow({ name, when, last = false }) {
  return (
    <div className="hstack" style={{ gap: 10, padding: "10px 16px", position: "relative", minHeight: 56 }}>
      <div style={{ flex: 1 }}>
        <div className="t-subhead" style={{ fontWeight: 600 }}>{name}</div>
        <div className="t-footnote ter">{when}</div>
      </div>
      <div className="fc-btn fc-btn--secondary" style={{ padding: "9px 14px", fontSize: 14 }}>Decline</div>
      <div className="fc-btn fc-btn--primary" style={{ padding: "9px 16px", fontSize: 14 }}>Approve</div>
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 16, right: 0 }}></div>}
    </div>
  );
}
function MemberRow({ name, joined, nodevice = false, swiped = false, last = false }) {
  return (
    <div style={{ position: "relative", overflow: "hidden" }}>
      {swiped && (
        <div style={{ position: "absolute", inset: 0, display: "flex", justifyContent: "flex-end" }}>
          <div style={{ width: 88, background: "var(--action-destructive-bg)", color: "#fff", display: "flex", alignItems: "center", justifyContent: "center", font: "600 14px/18px var(--font-ui)" }}>Remove</div>
        </div>
      )}
      <div className="hstack" style={{ gap: 12, padding: "11px 16px", position: "relative", minHeight: 50, background: "var(--surface-card)", transform: swiped ? "translateX(-88px)" : "none" }}>
        <div style={{ flex: 1 }}>
          <div className="t-subhead" style={{ fontWeight: 600 }}>{name}</div>
          <div className="t-footnote ter">joined {joined}</div>
        </div>
        {nodevice && <Chip state="nodevice" label="No device by default" />}
        {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 16, right: 0 }}></div>}
      </div>
    </div>
  );
}
function Roster() {
  return (
    <React.Fragment>
      <div className="hstack">
        <SectionLabel>Want to join · 3</SectionLabel>
        <div className="spacer"></div>
        <span className="t-footnote" style={{ color: "var(--text-brand)", fontWeight: 600 }}>Approve all</span>
      </div>
      <Card5>
        <ApprovalRow name="Dana Cole" when="2 min ago · joined by code" />
        <ApprovalRow name="Leo Marsh" when="14 min ago · joined by code" />
        <ApprovalRow name="Sofia Reyes" when="this morning · joined by tag" last />
      </Card5>
      <SectionLabel style={{ marginTop: 4 }}>Members · 28</SectionLabel>
      <div className="fc-input hstack" style={{ gap: 8, color: "var(--text-tertiary)" }}>
        <Icon name="search" size={15} />
        <span className="t-subhead ter">Search students</span>
      </div>
      <Card5>
        <MemberRow name="Aisha Khan" joined="Aug 28" />
        <MemberRow name="Diego Morales" joined="Aug 28" swiped />
        <MemberRow name="Jordan Park" joined="Aug 29" />
        <MemberRow name="Priya Shah" joined="Sep 3" nodevice />
        <MemberRow name="Sam Torres" joined="Aug 28" />
        <MemberRow name="Lena Wright" joined="Sep 9" last />
      </Card5>
      <div className="t-footnote ter" style={{ textAlign: "center" }}>… scrolls to all 28, A–Z</div>
    </React.Fragment>
  );
}

/* ---------- Policy ---------- */
function Policy() {
  return (
    <React.Fragment>
      <Card5 style={{ padding: "16px 16px 14px" }}>
        <div className="hstack" style={{ gap: 10 }}>
          <div className="t-title3">Lecture</div>
          <div className="spacer"></div>
          <span className="t-footnote ter">default for this class</span>
        </div>
        <div className="t-subhead sec" style={{ marginTop: 4 }}>Notes, Camera, Calculator allowed</div>
        <div style={{ margin: "14px 0 4px" }}>
          <AppsRow apps={[["notebook-pen", "Notes"], ["camera", "Camera"], ["calculator", "Calculator"]]} size={44} />
        </div>
        <div className="sep" style={{ margin: "12px -16px 0" }}></div>
        <div className="hstack" style={{ gap: 10, paddingTop: 12 }}>
          <Icon name="info" size={15} color="var(--text-tertiary)" />
          <span className="t-footnote ter">Phone stays available — iOS can't shield it. Messages is shielded.</span>
        </div>
      </Card5>
      <div className="hstack" style={{ gap: 10 }}>
        <div className="fc-btn fc-btn--secondary" style={{ flex: 1, padding: "11px 0" }}><Icon name="pencil" size={15} />Edit policy</div>
        <div className="fc-btn fc-btn--secondary" style={{ flex: 1, padding: "11px 0" }}>Change default</div>
      </div>
      <div className="t-footnote ter">Students pick these apps on their own phones. Bali can't choose apps for them, and can't see which they picked — it only knows how many.</div>
    </React.Fragment>
  );
}

/* ---------- Tags ---------- */
function TagRow({ label, code, active, last }) {
  return (
    <div className="hstack" style={{ gap: 12, padding: "14px 16px", position: "relative" }}>
      <Icon name="nfc" size={20} color={active ? "var(--text-brand)" : "var(--text-tertiary)"} />
      <div style={{ flex: 1 }}>
        <div className="t-body" style={{ fontWeight: 600, color: active ? "var(--text-primary)" : "var(--text-tertiary)" }}>{label}</div>
        <div className="t-footnote ter" style={{ fontFamily: "var(--font-mono)", letterSpacing: "0.08em", marginTop: 1 }}>{code}</div>
      </div>
      {active ? <Chip state="focused" label="Active" /> : <span className="t-footnote ter">Off</span>}
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 48, right: 0 }}></div>}
    </div>
  );
}
function Tags() {
  return (
    <React.Fragment>
      <Card5>
        <TagRow label="Front desk" code="T7XK2M9QPF" active />
        <TagRow label="Lab door" code="T2RV8N4WLD" active />
        <TagRow label="Old tag — Sept" code="T9QA1C6XSE" last />
      </Card5>
      <BigButton><Icon name="plus" size={18} />Write a new tag</BigButton>
      <div className="t-footnote ter">Writing opens the T4 flow — label first, then the system NFC sheet. Tap a tag to rename or deactivate; print copies from the web dashboard.</div>
    </React.Fragment>
  );
}

/* ---------- Activity ---------- */
function Activity() {
  return (
    <React.Fragment>
      <div className="framing5">Patterns are conversation starters, not verdicts.</div>
      <SectionLabel>Today</SectionLabel>
      <Card5 style={{ padding: 16 }}>
        <div className="fc-timeline">
          <div className="ev is-emergency"><div className="dot"><Icon name="lock-open" size={13} /></div><div className="what">Sam T. used Emergency Unlock<small>reason pending</small></div><div className="when">10:31</div></div>
          <div className="ev is-pass"><div className="dot"><Icon name="ticket" size={13} /></div><div className="what">Aisha K. — 10-minute pass<small>“nurse”</small></div><div className="when">10:18</div></div>
          <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Session started — Lecture policy<small>28 expected</small></div><div className="when">9:50</div></div>
        </div>
      </Card5>
      <SectionLabel>Tuesday, June 9</SectionLabel>
      <Card5 style={{ padding: 16 }}>
        <div className="fc-timeline">
          <div className="ev"><div className="dot"><Icon name="flag" size={13} /></div><div className="what">Session ended at the bell<small>26 of 28 focused · 47 min</small></div><div className="when">10:45</div></div>
          <div className="ev is-revoked"><div className="dot"><Icon name="shield-off" size={13} /></div><div className="what">Diego M. turned permission off<small>rejoined 4 min later</small></div><div className="when">10:12</div></div>
          <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Session started — Lecture policy</div><div className="when">9:50</div></div>
        </div>
      </Card5>
      <div className="fc-btn fc-btn--ghost" style={{ alignSelf: "center" }}>Load earlier</div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet5 num="T6 · new" title="Class Detail — the per-class hub" here="T6"
      intro="Everything about one class on the phone: a header that always carries the join code and the context-aware primary action, then a sticky segmented control — Overview · Roster · Policy · Tags · Activity. Each segment composes existing pieces: StatusChip, EventTimeline, TagCard rows, the arc. Depth here is participation and status only — there is no app-usage, browsing, or location data anywhere in the product, so no layout asks for it.">
      <div className="frames">
        <Frame label="T6.1 · Overview — idle" light note={<span><b>Quick stats stay neutral:</b> focus minutes are framed as time-in-session, with the measurement honesty spelled out right under the grid. Recap row → T10; Edit class opens a Form sheet (name, schedule, auto-approve, default policy). Join-code chip taps into the big projectable JoinCodeBadge with share.</span>}>
          <T6Screen tab="Overview"><Overview /></T6Screen>
        </Frame>
        <Frame label="T6.2 · Overview — session live" light note={<span><b>Active-session banner pins under the header</b> on every segment, with the arc and a one-line §2 summary; the header's primary action flips to Open live grid (→ T2). Nothing else moves — the teacher keeps their place.</span>}>
          <T6Screen tab="Overview" live><Overview /></T6Screen>
        </Frame>
        <Frame label="T6.3 · Roster — approvals waiting" light note={<span><b>“Want to join” is invitational</b> — never “requests pending review.” Approve/Decline inline (44pt targets) plus Approve all. One member row shown mid-swipe: Remove is the destructive action, so it's the only red on the screen; it confirms before anything happens. Priya's default no-device marker carries the dashed chip into every session. Empty roster reads “Share the join code to add students.”</span>}>
          <T6Screen tab="Roster"><Roster /></T6Screen>
        </Frame>
        <Frame label="T6.4 · Policy" light note={<span>The class default, read-only: name, allowed apps, and the honest system note (Phone can't be shielded). Edit policy → T8 editor; Change default → picker of the teacher's policies. The device-mapping explainer keeps the §6 honesty visible where policies live.</span>}>
          <T6Screen tab="Policy"><Policy /></T6Screen>
        </Frame>
        <Frame label="T6.5 · Tags" light note={<span>This class's tags as T4 TagCard rows — label, mono code, Active state. Write a new tag reuses the T4 flow with the system NFC sheet; deactivation keeps its destructive confirm (“every printed copy stops working”).</span>}>
          <T6Screen tab="Tags"><Tags /></T6Screen>
        </Frame>
        <Frame label="T6.6 · Activity" light note={<span>The per-class slice of W9: EventTimeline grouped by day, cursor-paginated via Load earlier. The framing line stays visible on every history surface. Red appears only on the revoked event's icon — and the copy beside it is factual, not accusatory: “turned permission off · rejoined 4 min later.”</span>}>
          <T6Screen tab="Activity"><Activity /></T6Screen>
        </Frame>
        <Frame label="T6.7 · Overview at Dynamic Type XL" sub="accessibility proof" light note={<span><b>The dense screen survives XL:</b> the stat grid reflows to one column (auto-fit, no truncation), rows grow instead of clipping, buttons keep 44pt+. In SwiftUI the segmented control scrolls horizontally at accessibility sizes; nothing relies on text fitting one line.</span>}>
          <T6Screen tab="Overview" xl><Overview /></T6Screen>
        </Frame>
      </div>
    </Sheet5>
  );
}
mountSheet(App);
</script>
</body>
</html>
