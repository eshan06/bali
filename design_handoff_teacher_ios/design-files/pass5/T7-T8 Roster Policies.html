<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T7–T8 · Roster & Approvals, Policies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="../pass3/sheet.css">
<link rel="stylesheet" href="pass5.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="../pass3/ios-frame.jsx"></script>
<script type="text/babel" src="../pass3/scaffold.jsx"></script>
<script type="text/babel" src="scaffold5.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- T7 · Roster & Approvals (standalone, from the T1 badge) ---------- */
function ApprovalRow({ name, when, last = false }) {
  return (
    <div className="hstack" style={{ gap: 10, padding: "10px 16px", position: "relative", minHeight: 56 }}>
      <div style={{ flex: 1 }}>
        <div className="t-subhead" style={{ fontWeight: 600 }}>{name}</div>
        <div className="t-footnote ter">{when}</div>
      </div>
      <div className="fc-btn fc-btn--secondary" style={{ padding: "9px 14px", fontSize: 14 }}>Decline</div>
      <div className="fc-btn fc-btn--primary" style={{ padding: "9px 16px", fontSize: 14 }}>Approve</div>
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 16, right: 0 }}></div>}
    </div>
  );
}
function MemberRow({ name, joined, nodevice = false, last = false }) {
  return (
    <div className="hstack" style={{ gap: 12, padding: "11px 16px", position: "relative", minHeight: 50 }}>
      <div style={{ flex: 1 }}>
        <div className="t-subhead" style={{ fontWeight: 600 }}>{name}</div>
        <div className="t-footnote ter">joined {joined}</div>
      </div>
      {nodevice && <Chip state="nodevice" label="No device by default" />}
      <Icon name="chevron-right" size={15} color="var(--text-tertiary)" />
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 16, right: 0 }}></div>}
    </div>
  );
}

function RosterScreen({ memberSheet = false, removeConfirm = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 70, gap: 12, paddingBottom: 28, filter: memberSheet || removeConfirm ? "blur(1px)" : "none", opacity: memberSheet || removeConfirm ? 0.55 : 1 }}>
        <div className="hstack" style={{ gap: 5, color: "var(--text-brand)" }}>
          <Icon name="chevron-left" size={17} />
          <span className="t-subhead" style={{ color: "var(--text-brand)", fontWeight: 500 }}>Period 1 — Algebra I</span>
        </div>
        <div>
          <div className="t-title1">Roster</div>
          <div className="t-footnote sec" style={{ marginTop: 3 }}>24 students · auto-approve off</div>
        </div>
        <div className="hstack">
          <SectionLabel>Want to join · 3</SectionLabel>
          <div className="spacer"></div>
          <span className="t-footnote" style={{ color: "var(--text-brand)", fontWeight: 600 }}>Approve all</span>
        </div>
        <Card5>
          <ApprovalRow name="Dana Cole" when="2 min ago · joined by code" />
          <ApprovalRow name="Leo Marsh" when="14 min ago · joined by code" />
          <ApprovalRow name="Sofia Reyes" when="this morning · joined by tag" last />
        </Card5>
        <SectionLabel style={{ marginTop: 4 }}>Members · 24</SectionLabel>
        <div className="fc-input hstack" style={{ gap: 8, color: "var(--text-tertiary)" }}>
          <Icon name="search" size={15} />
          <span className="t-subhead ter">Search students</span>
        </div>
        <Card5>
          <MemberRow name="Amara Diallo" joined="Aug 28" />
          <MemberRow name="Felix Grant" joined="Aug 28" />
          <MemberRow name="Hana Sato" joined="Aug 29" nodevice />
          <MemberRow name="Ivan Kovac" joined="Sep 3" />
          <MemberRow name="Jade Lin" joined="Sep 9" last />
        </Card5>
        <div className="t-footnote ter" style={{ textAlign: "center" }}>… scrolls to all 24, A–Z</div>
      </div>
      <div className="spacer"></div>
      {memberSheet && (
        <React.Fragment>
          <div className="dim"></div>
          <div className="native-sheet" style={{ paddingBottom: 44 }}>
            <div className="grabber"></div>
            <div className="t-title2" style={{ textAlign: "center" }}>Hana Sato</div>
            <div className="t-subhead sec" style={{ textAlign: "center", marginTop: 4 }}>joined Aug 29 · Period 1 — Algebra I</div>
            <div className="vstack" style={{ gap: 12, marginTop: 20 }}>
              <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "11px 16px", gap: 12, minHeight: 48 }}>
                <Icon name="smartphone" size={18} color="var(--text-secondary)" />
                <div style={{ flex: 1 }}>
                  <div className="t-body">No device by default</div>
                  <div className="t-footnote ter">Hana starts every session marked no-device</div>
                </div>
                <button className="fc-toggle is-on" aria-label="No device by default, on"></button>
              </div>
              <div className="fc-btn fc-btn--secondary" style={{ padding: "12px 0", color: "var(--red-600)", borderColor: "var(--border-strong)" }}>Remove from class</div>
              <div className="fc-btn fc-btn--secondary" style={{ padding: "12px 0" }}>Cancel</div>
            </div>
          </div>
        </React.Fragment>
      )}
      {removeConfirm && (
        <React.Fragment>
          <div className="dim"></div>
          <div className="ios-alert light">
            <div className="a-body">
              <div className="a-title">Remove Hana from Period 1?</div>
              <div className="a-msg">Her focus history stays hers. She can rejoin any time with the class code.</div>
            </div>
            <div className="a-btns"><div>Cancel</div><div style={{ color: "#C44A3C" }}>Remove</div></div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

/* ---------- T8 · Policies (list + editor) ---------- */
function PolicyRow({ name, allowed, used, last = false }) {
  return (
    <div className="hstack" style={{ gap: 12, padding: "13px 16px", position: "relative", minHeight: 52 }}>
      <Icon name="list-checks" size={19} color="var(--text-secondary)" />
      <div style={{ flex: 1 }}>
        <div className="t-body" style={{ fontWeight: 600 }}>{name}</div>
        <div className="t-footnote ter">{allowed}</div>
      </div>
      <span className="t-footnote ter">{used}</span>
      <Icon name="chevron-right" size={15} color="var(--text-tertiary)" />
      {!last && <div className="sep" style={{ position: "absolute", bottom: 0, left: 47, right: 0 }}></div>}
    </div>
  );
}
function PolicyList({ deleteGuard = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 80, gap: 14, filter: deleteGuard ? "blur(1px)" : "none", opacity: deleteGuard ? 0.55 : 1 }}>
        <div className="t-lgtitle">Policies</div>
        <div className="t-subhead sec">What stays available while a class is focused. A policy can be shared by several classes.</div>
        <Card5>
          <PolicyRow name="Lecture" allowed="Notes, Camera, Calculator" used="3 classes" />
          <PolicyRow name="Quiz" allowed="Calculator only" used="1 class" />
          <PolicyRow name="Discussion" allowed="Notes" used="unused" last />
        </Card5>
        <BigButton><Icon name="plus" size={18} />New policy</BigButton>
      </div>
      <div className="spacer"></div>
      {deleteGuard && (
        <React.Fragment>
          <div className="dim"></div>
          <div className="ios-alert light">
            <div className="a-body">
              <div className="a-title">Lecture is in use</div>
              <div className="a-msg">3 classes use it as their default. Give them a different policy first, then delete.</div>
            </div>
            <div className="a-btns"><div style={{ fontWeight: 600 }}>OK</div></div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}
function PolicyEditor() {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 70, gap: 12, paddingBottom: 28 }}>
        <div className="hstack" style={{ gap: 5, color: "var(--text-brand)" }}>
          <Icon name="chevron-left" size={17} />
          <span className="t-subhead" style={{ color: "var(--text-brand)", fontWeight: 500 }}>Policies</span>
        </div>
        <div className="t-title1">Edit policy</div>
        <SectionLabel>Name</SectionLabel>
        <input className="fc-input" value="Lecture" readOnly style={{ fontSize: 17, padding: "12px 14px" }} />
        <SectionLabel style={{ marginTop: 6 }}>System</SectionLabel>
        <Card5>
          <div className="hstack" style={{ gap: 12, padding: "11px 16px", position: "relative", minHeight: 48 }}>
            <Icon name="phone" size={18} color="var(--text-tertiary)" />
            <div style={{ flex: 1 }}>
              <div className="t-body" style={{ color: "var(--text-tertiary)" }}>Phone</div>
              <div className="t-footnote ter">Always available — iOS can't shield it</div>
            </div>
            <button className="fc-toggle is-on is-disabled" aria-label="Phone, always on"></button>
            <div className="sep" style={{ position: "absolute", bottom: 0, left: 46, right: 0 }}></div>
          </div>
          <div className="hstack" style={{ gap: 12, padding: "11px 16px", minHeight: 48 }}>
            <Icon name="message-circle" size={18} color="var(--text-secondary)" />
            <div style={{ flex: 1 }}>
              <div className="t-body">Messages</div>
              <div className="t-footnote ter">Shielded during focus</div>
            </div>
            <button className="fc-toggle" aria-label="Messages allowed, off"></button>
          </div>
        </Card5>
        <SectionLabel style={{ marginTop: 6 }}>Allowed during focus</SectionLabel>
        <Card5 style={{ padding: "12px 14px" }}>
          <div className="hstack" style={{ gap: 8, flexWrap: "wrap" }}>
            <span className="fc-tag">Notes<button type="button"><Icon name="x" size={13} /></button></span>
            <span className="fc-tag">Camera<button type="button"><Icon name="x" size={13} /></button></span>
            <span className="fc-tag">Calculator<button type="button"><Icon name="x" size={13} /></button></span>
            <span className="t-subhead ter" style={{ padding: "4px 2px" }}>Add an app name…</span>
          </div>
        </Card5>
        <div className="t-footnote ter">Students pick these apps on their own phones. Bali can't choose apps for them, and can't see which they picked — it only knows how many.</div>
        <BigButton style={{ marginTop: 6 }}>Save policy</BigButton>
        <div className="fc-btn fc-btn--ghost" style={{ alignSelf: "center", color: "var(--red-600)" }}>Delete policy</div>
      </div>
      <div className="spacer"></div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet5 num="T7–T8 · new" title="Roster & Approvals · Policies" here="T7–T8"
      intro="T7 is the time-sensitive screen — a student joining mid-class can't wait for a laptop. Approvals sit on top with inline Approve/Decline and a batch action; members get search, a default no-device marker, and a guarded remove. T8 brings the web PolicyEditor to a SwiftUI Form, with the device-mapping honesty kept verbatim.">
      <div className="frames">
        <Frame label="T7.1 · Roster — approvals waiting" light note={<span><b>“Want to join” — invitational, never “requests pending review.”</b> This is where the T1 badge and T6's Roster tab land. Approve/Decline are 44pt inline; Approve all batches. Clean state: the section simply isn't there. Empty class: “Share the join code to add students.”</span>}>
          <RosterScreen />
        </Frame>
        <Frame label="T7.2 · Member actions" light note={<span>Tapping a member opens a small-detent sheet: the default no-device toggle (carries into every session as the dashed `no_device` state) and Remove — red text because it's destructive, and the only red on the screen.</span>}>
          <RosterScreen memberSheet />
        </Frame>
        <Frame label="T7.3 · Remove confirm" light note={<span>The consequence is stated without ceremony, and the copy keeps dignity: her history stays hers, rejoining stays open. Red on the destructive action only.</span>}>
          <RosterScreen removeConfirm />
        </Frame>
        <Frame label="T8.1 · Policy list" light note={<span>Name + allowed summary + “used by N classes” — the reuse count is the delete guard's source of truth. Rows open the editor; New policy opens it blank (first-policy empty state CTA reads “Create your first policy”).</span>}>
          <PolicyList />
        </Frame>
        <Frame label="T8.2 · Editor" sub="SwiftUI Form" light note={<span><b>The honesty lives here:</b> Phone is shown always-on and disabled with the plain reason; exceptions are display names in a tag input, and the device-mapping explainer is verbatim from the brief. Delete is ghost red at the bottom — destructive only.</span>}>
          <PolicyEditor />
        </Frame>
        <Frame label="T8.3 · Delete guard — in use" light note={<span>A policy serving 3 classes can't silently vanish: the alert names the count and the fix. No red — nothing is being destroyed; the action was prevented.</span>}>
          <PolicyList deleteGuard />
        </Frame>
      </div>
    </Sheet5>
  );
}
mountSheet(App);
</script>
</body>
</html>
