<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T9–T10 · Start Session & Session Recap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="../pass3/sheet.css">
<link rel="stylesheet" href="pass5.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="../pass3/ios-frame.jsx"></script>
<script type="text/babel" src="../pass3/scaffold.jsx"></script>
<script type="text/babel" src="scaffold5.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- T9 · Start Session (sheet with detents, over T6) ---------- */
function SheetRow({ icon, label, value, hint, chevron = true, error = false, last = false }) {
  return (
    <div className="vstack">
      <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "13px 16px", gap: 12, minHeight: 48, border: error ? "1px solid var(--red-500)" : "none" }}>
        <Icon name={icon} size={18} color="var(--text-secondary)" />
        <span className="t-body">{label}</span>
        <div className="spacer"></div>
        <span className="t-body" style={{ fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{value}</span>
        {hint && <span className="t-footnote ter">{hint}</span>}
        {chevron && <Icon name="chevron-down" size={15} color="var(--text-tertiary)" />}
      </div>
      {error && <span className="fc-fielderr">That's already past — pick a time after 10:22.</span>}
    </div>
  );
}

function T6Backdrop() {
  return (
    <div className="safe vstack" style={{ paddingTop: 70, filter: "blur(1px)", opacity: 0.45 }}>
      <div className="t-title1">Period 3 — Algebra II</div>
      <div className="t-footnote sec" style={{ marginTop: 3 }}>MWF · 9:50–10:45 · 28 students</div>
    </div>
  );
}

function StartSessionSheet({ noMembers = false, timeError = false }) {
  return (
    <React.Fragment>
      <T6Backdrop />
      <div className="dim"></div>
      <div className="native-sheet" style={{ paddingBottom: 44 }}>
        <div className="grabber"></div>
        <div className="t-title2" style={{ textAlign: "center" }}>Start a session</div>
        <div className="t-subhead sec" style={{ textAlign: "center", marginTop: 4 }}>Period 3 — Algebra II</div>
        {noMembers ? (
          <div className="vstack" style={{ alignItems: "center", gap: 16, textAlign: "center", padding: "30px 10px 6px" }}>
            <div style={{ width: 56, height: 56, borderRadius: 999, background: "var(--surface-sunken)", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="user-plus" size={24} color="var(--text-tertiary)" />
            </div>
            <div className="t-headline" style={{ maxWidth: 280 }}>No students have joined yet</div>
            <div className="t-subhead sec" style={{ maxWidth: 290 }}>Share the join code first — students join from the Bali iOS app, then you can start.</div>
            <div className="hstack" style={{ gap: 8, background: "var(--surface-sunken)", border: "1px solid var(--border-default)", borderRadius: 10, padding: "10px 16px" }}>
              <span style={{ fontFamily: "var(--font-mono)", fontWeight: 600, fontSize: 18, letterSpacing: "0.14em" }}>KM3W7Q2A</span>
              <Icon name="share" size={16} color="var(--text-secondary)" />
            </div>
            <div className="fc-btn fc-btn--secondary" style={{ padding: "11px 22px" }}>Show it big to project</div>
          </div>
        ) : (
          <div className="vstack" style={{ gap: 12, marginTop: 22 }}>
            <SheetRow icon="bell" label="Ends at" value={timeError ? "9:15" : "10:45"} hint={timeError ? null : "next bell"} error={timeError} />
            <SheetRow icon="list-checks" label="Policy" value="Lecture" />
            <div className="t-footnote ter" style={{ padding: "0 4px" }}>Lecture — Notes, Camera, Calculator allowed</div>
            <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "13px 16px", gap: 12, minHeight: 48 }}>
              <Icon name="users" size={18} color="var(--text-secondary)" />
              <span className="t-body">Expecting</span>
              <div className="spacer"></div>
              <span className="t-body" style={{ fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>27 students</span>
              <span className="t-footnote ter">1 no-device</span>
            </div>
            <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "11px 16px", gap: 12, minHeight: 48 }}>
              <Icon name="alarm-clock" size={18} color="var(--text-secondary)" />
              <div style={{ flex: 1 }}>
                <div className="t-body">Remind me at the end</div>
                <div className="t-footnote ter">A notification on this phone, nothing else</div>
              </div>
              <button className="fc-toggle is-on" aria-label="Remind me at the end, on"></button>
            </div>
            <BigButton style={timeError ? { opacity: 0.45 } : {}}>Start session</BigButton>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

/* ---------- T10 · Session Recap ---------- */
function RecapStat({ num, lbl }) {
  return <div className="stat"><div className="num">{num}</div><div className="lbl">{lbl}</div></div>;
}

function Recap({ clean = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 80, gap: 12, paddingBottom: 28 }}>
        <div>
          <div className="t-title1">{clean ? "Smooth period." : "Session recap"}</div>
          <div className="t-footnote sec" style={{ marginTop: 3 }}>Period 3 — Algebra II · today 9:50–10:45 · 55 min</div>
        </div>
        {clean ? (
          <div className="vstack" style={{ alignItems: "center", gap: 16, textAlign: "center", padding: "26px 0 8px" }}>
            <Arc size={110} stroke={8} pct={1} fill="var(--green-600)">
              <Icon name="check" size={32} color="var(--text-brand)" />
            </Arc>
            <div className="t-headline" style={{ maxWidth: 290 }}>Everyone who tapped in stayed focused to the bell</div>
            <div className="t-subhead sec">25 students · 47 min median focus</div>
          </div>
        ) : (
          <React.Fragment>
            <div className="statgrid">
              <RecapStat num="22" lbl="stayed focused" />
              <RecapStat num="1" lbl="emergency unlock" />
              <RecapStat num="1" lbl="pass" />
              <RecapStat num="1" lbl="permission off" />
            </div>
            <div className="t-footnote ter">41 min median focus · 2 never joined · Priya S. marked no-device</div>
            <SectionLabel style={{ marginTop: 4 }}>Emergencies</SectionLabel>
            <Card5>
              <div className="hstack" style={{ gap: 12, padding: "12px 16px", minHeight: 48 }}>
                <div style={{ width: 36, height: 36, borderRadius: 999, background: "var(--state-emergency-bg)", color: "var(--state-emergency-fg)", display: "flex", alignItems: "center", justifyContent: "center", flex: "none" }}>
                  <Icon name="lock-open" size={16} />
                </div>
                <div style={{ flex: 1 }}>
                  <div className="t-subhead" style={{ fontWeight: 600 }}>Sam Torres · 10:31</div>
                  <div className="t-footnote ter">Reason shared: family · re-focused 10:35</div>
                </div>
              </div>
              <div className="sep" style={{ marginLeft: 16 }}></div>
              <div className="hstack" style={{ gap: 10, padding: "11px 16px" }}>
                <Icon name="message-circle" size={15} color="var(--text-tertiary)" />
                <span className="t-footnote sec">A quiet check-in with Sam later might be welcome.</span>
              </div>
            </Card5>
            <div className="framing5">Patterns are conversation starters, not verdicts.</div>
          </React.Fragment>
        )}
        <div className="vstack" style={{ gap: 10, marginTop: clean ? 18 : 6 }}>
          <BigButton>Done</BigButton>
          <div className="fc-btn fc-btn--secondary" style={{ padding: "12px 0" }}>View full log</div>
        </div>
      </div>
      <div className="spacer"></div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet5 num="T9–T10 · new" title="Start Session & Session Recap" here="T9–T10"
      intro="T9 replaces the abrupt jump from tap-Start to live grid with one prefilled confirmation sheet — end time from the next bell, the class's default policy, the expected count, and a local end-of-session reminder. T10 closes the loop: when a session ends, the teacher gets a neutral recap instead of a blank return — no ranking, no scoreboard, and red nowhere.">
      <div className="frames">
        <Frame label="T9.1 · Start sheet — prefilled" light note={<span><b>Two decisions, both prefilled,</b> exactly like the brief's T1 sheet — T9 just adds what full-control needs: the expected count (with the no-device carry-in) and an on-device reminder. The policy's allowed list is restated under the picker. Already-active edge: the sheet blocks with “End the current session first” and a link to the live grid.</span>}>
          <StartSessionSheet />
        </Frame>
        <Frame label="T9.2 · End time in the past" light note={<span>Validation, not punishment: the row outlines, one plain sentence names the fix, Start disables. Red here is the form-error treatment from the component sheet — the same one web uses.</span>}>
          <StartSessionSheet timeError />
        </Frame>
        <Frame label="T9.3 · No students yet" light note={<span>The empty class can't start a useless session — the sheet turns into the path forward: the join code, share, and the projectable version. “Show it big” opens the same JoinCodeBadge as T6's header chip.</span>}>
          <StartSessionSheet noMembers />
        </Frame>
        <Frame label="T10.1 · Recap — session with an emergency" sub="auto-presents on end" light note={<span><b>Neutral recap, not a scoreboard:</b> counts per §2 state, the emergency listed plainly with its shared reason, and a quiet check-in nudge — a prompt to talk, never a discipline hook. The framing line stays visible. The only orange is the emergency icon; no red anywhere — `revoked` appeared in-session, but a recap is history, not an alarm.</span>}>
          <Recap />
        </Frame>
        <Frame label="T10.2 · Recap — clean session" light note={<span>“Smooth period.” — light celebration, one sentence, no confetti. Short or aborted sessions get the same layout with the duration stated plainly (“7 min — ended early”).</span>}>
          <Recap clean />
        </Frame>
      </div>
    </Sheet5>
  );
}
mountSheet(App);
</script>
</body>
</html>
