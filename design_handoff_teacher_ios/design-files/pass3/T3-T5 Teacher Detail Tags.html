<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T3–T5 · Student Detail, Tag Writer, Passes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- T3 · Student detail sheet ---------- */
function StudentDetail() {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 74, gap: 12, filter: "blur(1px)", opacity: 0.45 }}>
        <div className="t-headline">Period 3 — Algebra II</div>
        <div className="t-footnote sec">23:14 · ends 10:45</div>
      </div>
      <div className="dim"></div>
      <div className="native-sheet" style={{ paddingBottom: 40 }}>
        <div className="grabber"></div>
        <div className="hstack" style={{ gap: 12 }}>
          <div>
            <div className="t-title2">Sam Torres</div>
            <div className="t-footnote sec" style={{ marginTop: 2 }}>tapped in 10:02 · iPhone</div>
          </div>
          <div className="spacer" />
          <Chip state="emergency" label="Unlocked" />
        </div>
        <div style={{ background: "var(--surface-card)", borderRadius: 14, padding: 16, marginTop: 16 }}>
          <div className="fc-timeline">
            <div className="ev is-focused"><div className="dot"><Icon name="circle-check" size={13} /></div><div className="what">Tapped in</div><div className="when">10:02</div></div>
            <div className="ev is-emergency"><div className="dot"><Icon name="lock-open" size={13} /></div><div className="what">Emergency Unlock<small>reason pending</small></div><div className="when">10:31</div></div>
          </div>
        </div>
        <div className="t-footnote ter" style={{ textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600, margin: "18px 0 8px" }}>Grant a pass</div>
        <div className="vstack" style={{ gap: 10 }}>
          <div className="fc-seg" style={{ alignSelf: "stretch", display: "flex" }}>
            {["5 min", "10 min", "15 min", "Custom"].map((l, i) => (
              <button key={l} type="button" className={i === 1 ? "is-active" : ""} style={{ flex: 1 }}>{l}</button>
            ))}
          </div>
          <input className="fc-input" placeholder="Reason (optional) — e.g. nurse" readOnly />
          <div className="fc-btn fc-btn--primary" style={{ padding: "12px 0" }}>Grant 10-minute pass</div>
          <span className="t-footnote ter">Shields return automatically when it ends.</span>
        </div>
        <div className="hstack" style={{ gap: 12, marginTop: 18, paddingTop: 16, borderTop: "1px solid var(--border-default)" }}>
          <div style={{ flex: 1 }}>
            <div className="t-subhead" style={{ fontWeight: 600 }}>No device today</div>
            <div className="t-footnote ter">Marks Sam out of today's grid only</div>
          </div>
          <button className="fc-toggle" aria-label="No device today, off"></button>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- T4 · Tag writer ---------- */
function TagRow({ label, code, active, last }) {
  return (
    <div className="hstack" style={{ gap: 12, padding: "14px 16px", position: "relative" }}>
      <Icon name="nfc" size={20} color={active ? "var(--text-brand)" : "var(--text-tertiary)"} />
      <div style={{ flex: 1 }}>
        <div className="t-body" style={{ fontWeight: 600, color: active ? "var(--text-primary)" : "var(--text-tertiary)" }}>{label}</div>
        <div className="t-footnote ter" style={{ fontFamily: "var(--font-mono)", letterSpacing: "0.08em", marginTop: 1 }}>{code}</div>
      </div>
      {active ? <Chip state="focused" label="Active" /> : <span className="t-footnote ter">Off</span>}
      {!last && <div style={{ position: "absolute", bottom: 0, left: 48, right: 0, height: 0.5, background: "var(--border-default)" }}></div>}
    </div>
  );
}
function TagList({ confirm = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 14 }}>
        <div className="t-lgtitle">Desk tags</div>
        <div className="t-subhead sec">Students tap these to start focus. One tag can live on many desks — print copies from the web dashboard.</div>
        <div style={{ background: "var(--surface-card)", borderRadius: 16, overflow: "hidden" }}>
          <TagRow label="Front desk" code="T7XK2M9QPF" active />
          <TagRow label="Lab door" code="T2RV8N4WLD" active />
          <TagRow label="Old tag — Sept" code="T9QA1C6XSE" last />
        </div>
        <BigButton><Icon name="plus" size={18} />Write a new tag</BigButton>
      </div>
      <div className="spacer" />
      {confirm && (
        <React.Fragment>
          <div className="dim"></div>
          <div className="ios-alert light">
            <div className="a-body">
              <div className="a-title">Deactivate "Front desk"?</div>
              <div className="a-msg">Every printed copy of this tag stops working immediately. Students can still join by code.</div>
            </div>
            <div className="a-btns"><div>Cancel</div><div style={{ color: "#C44A3C" }}>Deactivate</div></div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}
function WriteFlow({ done = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 14 }}>
        <div className="t-lgtitle">{done ? "Tag written" : "New tag"}</div>
        {done ? (
          <div className="vstack" style={{ alignItems: "center", gap: 20, textAlign: "center", paddingTop: 60 }}>
            <Arc size={120} stroke={8} pct={1} fill="var(--green-600)">
              <Icon name="check" size={36} color="var(--text-brand)" />
            </Arc>
            <div className="t-title2">"Window desk" is live</div>
            <div className="t-subhead sec" style={{ maxWidth: 290 }}>Stick it where students tap. Test it with your own phone before class — it should open the tap-in screen.</div>
            <div className="fc-btn fc-btn--secondary" style={{ padding: "11px 20px" }}>Verify with my phone</div>
          </div>
        ) : (
          <div className="vstack" style={{ gap: 10 }}>
            <label className="t-footnote sec" style={{ fontWeight: 600 }}>Label</label>
            <input className="fc-input" value="Window desk" readOnly style={{ fontSize: 17, padding: "12px 14px" }} />
            <span className="t-footnote ter">Only you see labels — name it by where it'll live.</span>
          </div>
        )}
      </div>
      <div className="spacer" />
      {!done && (
        <React.Fragment>
          <div className="dim"></div>
          {/* Apple's NFC scan sheet — system surface, untouched */}
          <div className="native-sheet" style={{ background: "#F2F2F7", color: "#000", alignItems: "center", textAlign: "center", paddingBottom: 44, height: 420 }}>
            <div className="grabber" style={{ background: "rgba(0,0,0,0.2)" }}></div>
            <div style={{ fontFamily: "-apple-system, system-ui", fontSize: 22, fontWeight: 600, marginTop: 8, color: "#000" }}>Ready to Scan</div>
            <div style={{ width: 110, height: 110, borderRadius: 26, border: "5px solid #0A84FF", margin: "44px 0 0", display: "flex", alignItems: "center", justifyContent: "center" }}>
              <Icon name="nfc" size={52} color="#0A84FF" />
            </div>
            <div style={{ fontFamily: "-apple-system, system-ui", fontSize: 15, color: "rgba(60,60,67,0.7)", marginTop: 40 }}>Hold your iPhone near the tag.</div>
            <div style={{ flex: 1 }}></div>
            <div style={{ width: "100%", background: "#E3E3E8", borderRadius: 14, padding: "15px 0", fontFamily: "-apple-system, system-ui", fontSize: 17, fontWeight: 600, color: "#000" }}>Cancel</div>
          </div>
        </React.Fragment>
      )}
    </React.Fragment>
  );
}

/* ---------- T5 · Passes log + prefs ---------- */
function Passes() {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 14 }}>
        <div className="t-lgtitle">Passes & alerts</div>
        <div className="t-footnote ter" style={{ textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600 }}>Active passes</div>
        <div style={{ background: "var(--surface-card)", borderRadius: 16, overflow: "hidden" }}>
          <div className="hstack" style={{ gap: 12, padding: "13px 16px", position: "relative" }}>
            <Icon name="ticket" size={18} color="var(--state-pass-fg)" />
            <div style={{ flex: 1 }}>
              <div className="t-body" style={{ fontWeight: 600 }}>Aisha Khan</div>
              <div className="t-footnote sec">"nurse" · Period 3 — Algebra II</div>
            </div>
            <span className="t-body" style={{ fontWeight: 600, fontVariantNumeric: "tabular-nums", color: "var(--state-pass-fg)" }}>4:32</span>
            <div style={{ position: "absolute", bottom: 0, left: 46, right: 0, height: 0.5, background: "var(--border-default)" }}></div>
          </div>
          <div className="hstack" style={{ gap: 12, padding: "13px 16px" }}>
            <Icon name="ticket" size={18} color="var(--text-tertiary)" />
            <span className="t-subhead ter">No other active passes</span>
          </div>
        </div>
        <div className="t-footnote ter" style={{ textTransform: "uppercase", letterSpacing: "0.05em", fontWeight: 600, marginTop: 8 }}>Notify me on my phone</div>
        <div style={{ background: "var(--surface-card)", borderRadius: 16, overflow: "hidden" }}>
          {[["Emergency unlocks", true], ["Permission turned off", true], ["Pass endings", false]].map(([l, on], i, a) => (
            <div key={l} className="hstack" style={{ gap: 12, padding: "12px 16px", position: "relative" }}>
              <span className="t-body" style={{ flex: 1 }}>{l}</span>
              <button className={"fc-toggle" + (on ? " is-on" : "")} aria-label={l}></button>
              {i < a.length - 1 && <div style={{ position: "absolute", bottom: 0, left: 16, right: 0, height: 0.5, background: "var(--border-default)" }}></div>}
            </div>
          ))}
        </div>
        <div className="t-footnote ter" style={{ maxWidth: 330 }}>Emergencies always alert on the dashboard regardless of phone settings.</div>
      </div>
      <div className="spacer" />
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet num="T3–T5" title="Student Detail · Tag Writer · Passes" here="T3–T5"
      intro="T3 is one sheet that does everything a teacher needs mid-lesson: see the story, grant a pass, mark no-device. T4 leans on the system NFC sheet for writing tags. T5 stays minimal — active passes and three notification switches.">
      <div className="frames">
        <Frame label="T3 · Student detail sheet" light note={<span>Reached by tapping any chip in T2. The pass form is identical to the web StudentPanel — same presets, same auto-return promise. "No device" is a toggle, not a removal.</span>}>
          <StudentDetail />
        </Frame>
        <Frame label="T4.1 · Tag list" light note={<span>TagCard rows: label, mono code, active state. Tags are class-scoped; printing copies happens on W7.</span>}>
          <TagList />
        </Frame>
        <Frame label="T4.2 · Write flow" sub="system NFC sheet" light note={<span>Label first, then Apple's scan sheet exactly as iOS draws it. We never restyle the NFC surface.</span>}>
          <WriteFlow />
        </Frame>
        <Frame label="T4.3 · Written + verify" light note={<span>Success states the physical next step — stick it, then verify with your own phone. Verification is a real tap, not a checkbox.</span>}>
          <WriteFlow done />
        </Frame>
        <Frame label="T4.4 · Deactivate confirm" light note={<span>Destructive confirm: red appears on the destructive action only, with the consequence ("every printed copy") stated in the body.</span>}>
          <TagList confirm />
        </Frame>
        <Frame label="T5 · Passes & alerts" light note={<span>Active passes tick with tabular digits. Notification prefs are three switches — emergencies always reach the dashboard.</span>}>
          <Passes />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
