<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bali — T1–T2 · Teacher Home & Live Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../tokens/tokens.css">
<link rel="stylesheet" href="../pass2/components.css">
<link rel="stylesheet" href="sheet.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="scaffold.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
/* ---------- T1 ---------- */
function ClassCard({ name, sub, live }) {
  return (
    <div style={{ background: "var(--surface-card)", borderRadius: 18, padding: "16px 18px", boxShadow: "var(--shadow-1)" }} className="vstack">
      <div className="hstack" style={{ gap: 10 }}>
        <div className="t-headline">{name}</div>
        <div className="spacer" />
        {live ? <Chip state="focused" label="Live · ends 10:45" /> : <Icon name="chevron-right" size={16} color="var(--text-tertiary)" />}
      </div>
      <div className="t-footnote sec" style={{ marginTop: 2 }}>{sub}</div>
      {live && (
        <div className="hstack" style={{ gap: 10, marginTop: 14 }}>
          <div className="fc-btn fc-btn--primary" style={{ flex: 1, padding: "10px 0" }}>Open live grid</div>
          <div className="fc-btn fc-btn--secondary" style={{ padding: "10px 16px" }}>Roster</div>
        </div>
      )}
    </div>
  );
}
function TeacherHome({ empty = false, sheet = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 84, gap: 14 }}>
        <div className="hstack">
          <div className="t-lgtitle">Classes</div>
          <div className="spacer" />
          <Icon name="settings-2" size={22} color="var(--text-secondary)" />
        </div>
        {empty ? (
          <div className="vstack" style={{ alignItems: "center", gap: 20, textAlign: "center", paddingTop: 120 }}>
            <Arc size={120} stroke={8} pct={0}>
              <Icon name="plus" size={30} color="var(--text-tertiary)" />
            </Arc>
            <div className="t-title2" style={{ maxWidth: 290 }}>Set up your first class</div>
            <div className="t-subhead sec" style={{ maxWidth: 290 }}>A class takes about a minute: name it, pick a policy, and put the join code on the board.</div>
            <div className="fc-btn fc-btn--primary" style={{ padding: "13px 26px", fontSize: 17, borderRadius: 14 }}>Create a class</div>
          </div>
        ) : (
          <React.Fragment>
            <ClassCard name="Period 3 — Algebra II" sub="28 students · Lecture policy" live />
            <ClassCard name="Period 1 — Algebra I" sub="24 students · next session 12:05" />
            <ClassCard name="Period 6 — Geometry" sub="26 students · next session 2:50" />
            <div className="fc-btn fc-btn--ghost" style={{ alignSelf: "center", marginTop: 6 }}><Icon name="plus" size={15} />New class</div>
          </React.Fragment>
        )}
      </div>
      <div className="spacer" />
      {sheet && <StartSheet />}
    </React.Fragment>
  );
}
function StartSheet() {
  return (
    <React.Fragment>
      <div className="dim"></div>
      <div className="native-sheet" style={{ paddingBottom: 44 }}>
        <div className="grabber"></div>
        <div className="t-title2" style={{ textAlign: "center" }}>Start a session</div>
        <div className="t-subhead sec" style={{ textAlign: "center", marginTop: 4 }}>Period 1 — Algebra I</div>
        <div className="vstack" style={{ gap: 12, marginTop: 22 }}>
          <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "14px 16px", gap: 12 }}>
            <Icon name="bell" size={18} color="var(--text-secondary)" />
            <span className="t-body">Ends at</span>
            <div className="spacer" />
            <span className="t-body" style={{ fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>12:50</span>
            <span className="t-footnote ter">next bell</span>
            <Icon name="chevron-down" size={15} color="var(--text-tertiary)" />
          </div>
          <div className="hstack" style={{ background: "var(--surface-card)", borderRadius: 14, padding: "14px 16px", gap: 12 }}>
            <Icon name="list-checks" size={18} color="var(--text-secondary)" />
            <span className="t-body">Policy</span>
            <div className="spacer" />
            <span className="t-body" style={{ fontWeight: 600 }}>Lecture</span>
            <Icon name="chevron-down" size={15} color="var(--text-tertiary)" />
          </div>
          <div className="t-footnote ter" style={{ padding: "0 4px" }}>Lecture — Notes, Camera, Calculator allowed</div>
          <BigButton>Start session</BigButton>
        </div>
      </div>
    </React.Fragment>
  );
}

/* ---------- T2 ---------- */
const ROSTER = [
  ["focused","Jordan P."],["focused","Lena W."],["pass","Aisha K.","4:32"],["focused","Marcus J."],
  ["emergency","Sam T."],["focused","Noor H."],["notjoined","Maya R."],["focused","Tavi O."],
  ["revoked","Diego M."],["focused","Ethan C."],["nodevice","Priya S."],["focused","Zoe B."],
  ["focused","Amara D."],["focused","Felix G."],["focused","Hana S."],["focused","Ivan K."],
  ["focused","Jade L."],["focused","Kai N."],["notjoined","Luca F."],["focused","Mei T."],
  ["focused","Nia W."],["focused","Omar A."],["focused","Rosa V."],["focused","Theo B."],
  ["focused","Uma P."],["focused","Vik R."],["focused","Wren H."],["focused","Yusuf E."],
];
const LABELS = { focused: "Focused", notjoined: "Not in", pass: "Pass", emergency: "Unlocked", revoked: "Perm. off", nodevice: "No device" };
function PhoneChip({ state, name, timer }) {
  return (
    <div className="hstack" style={{
      gap: 9, padding: "8px 12px", borderRadius: 12, minHeight: 46,
      background: state === "nodevice" ? "transparent" : `var(--state-${state}-bg)`,
      border: state === "nodevice" ? "1.5px dashed var(--state-nodevice-fg)" : "none",
      color: `var(--state-${state}-fg)`,
    }}>
      <Icon name={STATE_ICONS[state]} size={16} />
      <div className="vstack" style={{ gap: 0 }}>
        <span style={{ fontSize: 15, fontWeight: 600, lineHeight: "19px", color: "var(--text-primary)" }}>{name}</span>
        <span style={{ fontSize: 12, fontWeight: 500, lineHeight: "15px", fontVariantNumeric: "tabular-nums" }}>{LABELS[state]}{timer ? ` · ${timer}` : ""}</span>
      </div>
    </div>
  );
}
function LiveGridPhone({ alert = false }) {
  return (
    <React.Fragment>
      <div className="safe vstack" style={{ paddingTop: 74, gap: 12 }}>
        <div className="hstack" style={{ gap: 12 }}>
          <Arc size={38} stroke={4.5} pct={0.466} />
          <div>
            <div className="t-headline">Period 3 — Algebra II</div>
            <div className="t-footnote sec" style={{ fontVariantNumeric: "tabular-nums" }}>23:14 · ends 10:45</div>
          </div>
          <div className="spacer" />
          <div className="fc-btn fc-btn--secondary" style={{ padding: "7px 12px", fontSize: 14 }}>Extend</div>
          <div className="fc-btn fc-btn--secondary" style={{ padding: "7px 12px", fontSize: 14, color: "var(--red-600)" }}>End</div>
        </div>
        {alert && (
          <div className="fc-toast is-emergency" style={{ width: "100%", boxShadow: "var(--shadow-2)" }}>
            <div className="t-icon"><Icon name="lock-open" size={18} /></div>
            <div>
              <div className="t-title">Sam T. used Emergency Unlock</div>
              <div className="t-sub">Reason pending · 10:31 AM</div>
              <div className="t-actions"><a>Open student</a></div>
            </div>
            <div className="t-close"><Icon name="x" size={16} /></div>
          </div>
        )}
        <div className="hstack" style={{ gap: 6, flexWrap: "wrap" }}>
          <Chip state="focused" label="22" /><Chip state="notjoined" label="2" /><Chip state="pass" label="1" /><Chip state="emergency" label="1" /><Chip state="revoked" label="1" /><Chip state="nodevice" label="1" />
        </div>
        <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 7 }}>
          {ROSTER.slice(0, alert ? 16 : 20).map(([s, n, t]) => <PhoneChip key={n} state={s} name={n} timer={t} />)}
        </div>
        <div className="t-footnote ter" style={{ textAlign: "center", paddingBottom: 24 }}>… scrolls to all 28</div>
      </div>
    </React.Fragment>
  );
}

function App() {
  return (
    <Sheet num="T1–T2" title="Teacher Home & Live Grid" here="T1–T2"
      intro="Teacher screens are light-priority and tuned for a phone held while walking the room. The Start Session sheet defaults to the next bell so starting is two taps. T2's chips run at thumb scale (46pt) with the same icon+label state system as everywhere else.">
      <div className="frames">
        <Frame label="T1.1 · Teacher Home" light note={<span>The live class surfaces its grid as the primary action; idle classes stay one-line quiet. Member count and policy name double as a sanity check.</span>}>
          <TeacherHome />
        </Frame>
        <Frame label="T1.2 · Start Session sheet" light note={<span><b>Two decisions, both prefilled:</b> ends at the next bell (editable), last-used policy. The policy's allowed list is restated under the picker — what students will see.</span>}>
          <TeacherHome sheet />
        </Frame>
        <Frame label="T1.3 · Empty state" light note={<span>New-teacher empty state names the three steps and the time cost. No demo-data confetti.</span>}>
          <TeacherHome empty />
        </Frame>
        <Frame label="T2.1 · Live Grid" sub="§6 distribution" light note={<span>Summary chips give the 1-second read; the 2-up grid gives the 5-second read. Non-focused states sort toward the top in the live app; tapping any chip opens T3.</span>}>
          <LiveGridPhone />
        </Frame>
        <Frame label="T2.2 · Emergency toast lands" light note={<span>The AlertToaster slides under the header and sticks until dismissed. Sam's chip gets one soft pulse — no blinking, no siren red.</span>}>
          <LiveGridPhone alert />
        </Frame>
      </div>
    </Sheet>
  );
}
mountSheet(App);
</script>
</body>
</html>
