# The no-attribution backstop. CLAUDE.md bans Claude attribution outright,
# but the written rule alone did not hold: the GitHub MCP create_pull_request
# tool appends a "Generated by Claude Code" footer to the descriptions it
# writes, and 33 PR descriptions carried it (docs/DECISIONS.md, 2026-09-24).
# This fails a PR until its description and every commit on it are clean.
# The patterns and the how-to-fix messages live in
# .github/scripts/attribution.sh.
name: Attribution

on:
  pull_request:
    # edited: the fix for a flagged description is editing it, and that
    # must re-run the check without a push.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  no-attribution:
    name: No Claude attribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # First, so a pattern that stops matching fails this check instead of
      # quietly passing every PR.
      - name: Self-test the check
        run: .github/scripts/attribution.test.sh

      - name: PR description and commits carry no Claude attribution
        env:
          # Through env, never inline interpolation: the description is
          # anyone's text, and refnames may contain $, backticks, ;.
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          # The PR's own head, not HEAD: the checkout is GitHub's synthetic
          # merge commit, which never lands on main.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/attribution.sh "origin/$BASE_REF" "$HEAD_SHA"
