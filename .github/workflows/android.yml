# The Android build (docs/PLAN-ANDROID.md, AN2): the app and its modules built, Android Lint, and
# every module's JVM tests, on Linux, with the SDK packages and JDK the PC builds with
# (android/README.md). Only a PR that touches android/ or this file builds; Android's contract
# tests run on every PR but a docs-only one instead, in ci.yml's "Android contract tests (JVM)".
name: Android

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  # Decided here, not by a paths filter on the workflow: a workflow filtered
  # out never reports, so a required check would wait on it forever, while a
  # job skipped by its `if` reports success (as in ios.yml).
  changes:
    name: Android changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      android: ${{ steps.diff.outputs.android }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          # Through env, never inline: refnames may contain $, backticks, ;.
          BASE_REF: ${{ github.base_ref }}
        # The self-test first, as in ios.yml; each on its own line, so a
        # failure fails the step. touches.sh says how a moved file counts.
        run: |
          .github/scripts/touches.test.sh
          android=$(.github/scripts/touches.sh "origin/$BASE_REF" '^(android/|\.github/workflows/android\.yml$)')
          echo "android=$android" >> "$GITHUB_OUTPUT"

  build:
    name: Android build · Lint · JVM tests
    needs: changes
    if: needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The wrapper's jar is a binary every build runs: Gradle's published checksums first.
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      # JDK 21, as the PC's Android Studio has it: the runner's own, nothing downloaded.
      - name: Use JDK 21
        run: |
          [ -x "$JAVA_HOME_21_X64/bin/java" ] || { echo "::error::The runner has no JDK 21 (JAVA_HOME_21_X64)."; exit 1; }
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      # Gradle and the dependencies; a PR's first run starts from main's (ci.yml's contract tests).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-build-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/libs.versions.toml', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-build-
            gradle-${{ runner.os }}-
      # With the runner's SDK, which the build never adds to: a package it lacks fails here.
      - name: Build the app and the modules
        run: ./gradlew assemble
      # The app's lint reads core's and outbox's code too, and fails on a warning.
      - name: Android Lint
        run: ./gradlew :app:lint
      - name: The JVM tests
        run: ./gradlew test
