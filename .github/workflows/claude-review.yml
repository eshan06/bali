# The blocking AI reviewer. Reviews every PR's diff against this repository's
# own rules (CLAUDE.md, ARCHITECTURE.md) and fails the check on violations, so
# branch protection physically disables the merge button. Fail-closed: no
# verdict file means a red check.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # the action mints its GitHub App token via OIDC

jobs:
  review:
    name: Claude Review
    # A draft is not reviewed, and its run fails. Skipped, this check would
    # count as passing: a draft marked ready read as mergeable until the
    # ready_for_review run began, and #154 merged unreviewed that way. GitHub
    # reads only this workflow's newest run on the commit, so the review that
    # ready_for_review starts takes the draft run's place, and the merge waits
    # for its verdict.
    runs-on: ubuntu-latest
    steps:
      - name: A draft is not reviewed
        if: ${{ github.event.pull_request.draft }}
        # A re-run replays the draft's event, so it can only fail again.
        run: |
          echo "::error::Draft: the review runs when the PR is marked ready. Already ready? Re-running this run fails again: convert the PR to draft and back, or push a commit."
          exit 1

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Phase 6, S6: the secret scanner the review is checked with, set aside
      # before the reviewer runs. It is the base commit's, never the PR's (the
      # PR could change it, the reviewer could write files); only a base that
      # doesn't have it yet (S6's own PR) uses the tree's. Anything else fails.
      - name: Set aside the secret scanner
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          scanner="$RUNNER_TEMP/review-secrets.py"
          path=.github/scripts/review-secrets.py
          if git cat-file -e "$BASE_SHA:$path" 2>/dev/null; then
            git show "$BASE_SHA:$path" > "$scanner"
          elif git cat-file -e "$BASE_SHA^{commit}"; then
            cp "$path" "$scanner"
          else
            echo "::error::Can't read the base commit to get the secret scanner; the review won't be posted."
            exit 1
          fi

      - name: Claude reviews the diff
        uses: anthropics/claude-code-action@86d88e619d8e6caf07b5c3944dd14f441c533718 # v1.0.243
        with:
          # Billed to the owner's Claude subscription, not API credits. If
          # reviews start failing with credential errors, re-run
          # `claude setup-token` locally and update this repo secret.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Read,Grep,Glob,Write"
          prompt: |
            You are the blocking code reviewer for this repository. Review ONLY
            what this PR changes: `git diff origin/${{ github.base_ref }}...HEAD`.

            Judge the diff against the repository's own rules:
            - CLAUDE.md (conventions and working rules)
            - docs/ARCHITECTURE.md — "The six rules" and the data-model honesty rules
            - Tests must accompany code changes (new endpoint -> integration
              tests; bug fix -> regression test; engine/concurrency change ->
              race coverage)
            - Only packages/db/src/transitions.ts writes participations/events
            - Additive-only: no renaming/removing shipped /v1 fields or
              packages/shared vocab values
            - No secrets or credentials anywhere in the diff

            Also hunt for real correctness bugs (logic errors, lost writes, race
            conditions, missing authorization) and state a concrete failure
            scenario for each. Do NOT nitpick style that lint already enforces,
            and do NOT demand work outside this PR's scope.

            Write your review to a file named `claude-review.md` in the repo
            root:
            - two-sentence summary of the change and your verdict
            - findings as a list: `BLOCKER` or `WARN`, file:line, what breaks
            - BLOCKER is reserved for: violations of the rules above, missing
              tests for changed code, secrets, or a concrete correctness bug.
              Everything else is WARN.
            The FINAL line of the file must be exactly `VERDICT: PASS` (zero
            blockers) or exactly `VERDICT: FAIL`.

      - name: Post review and enforce verdict
        # Not on a draft: there is no review to post, and the first step said why.
        if: ${{ always() && !github.event.pull_request.draft }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f claude-review.md ]; then
            echo "::error::Claude produced no claude-review.md — failing closed."
            exit 1
          fi
          # Phase 6, S6: a review that looks like it holds a secret is never
          # posted, and the check fails; the PR gets a note without its text.
          if ! python3 -I "$RUNNER_TEMP/review-secrets.py" claude-review.md; then
            gh pr comment "$PR" --body "Claude Review withheld its review: it may contain a secret. The reason is in the Claude Review run's log. Check this PR's diff for a leaked credential, then push or re-run." || true
            exit 1
          fi
          {
            cat claude-review.md
            printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/review-comment.md
          gh pr comment "$PR" --body-file /tmp/review-comment.md || true
          if grep -q '^VERDICT: PASS$' claude-review.md; then
            echo "Claude Review: PASS"
          else
            echo "::error::Claude Review verdict is FAIL (or missing) — see the PR comment."
            exit 1
          fi
