# The blocking AI reviewer. Reviews every PR's diff against this repository's
# own rules (CLAUDE.md, ARCHITECTURE.md) and fails the check on violations, so
# branch protection physically disables the merge button. Fail-closed: no
# verdict file means a red check.
name: Claude Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  id-token: write # the action mints its GitHub App token via OIDC

jobs:
  review:
    name: Claude Review
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude reviews the diff
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: >-
            --model claude-opus-5
            --allowedTools "Bash(git diff:*),Bash(git log:*),Read,Grep,Glob,Write"
          prompt: |
            You are the blocking code reviewer for this repository. Review ONLY
            what this PR changes: `git diff origin/${{ github.base_ref }}...HEAD`.

            Judge the diff against the repository's own rules:
            - CLAUDE.md (conventions and working rules)
            - docs/ARCHITECTURE.md — "The six rules" and the data-model honesty rules
            - Tests must accompany code changes (new endpoint -> integration
              tests; bug fix -> regression test; engine/concurrency change ->
              race coverage)
            - Only packages/db/src/transitions.ts writes participations/events
            - Additive-only: no renaming/removing shipped /v1 fields or
              packages/shared vocab values
            - No secrets or credentials anywhere in the diff

            Also hunt for real correctness bugs (logic errors, lost writes, race
            conditions, missing authorization) and state a concrete failure
            scenario for each. Do NOT nitpick style that lint already enforces,
            and do NOT demand work outside this PR's scope.

            Write your review to a file named `claude-review.md` in the repo
            root:
            - two-sentence summary of the change and your verdict
            - findings as a list: `BLOCKER` or `WARN`, file:line, what breaks
            - BLOCKER is reserved for: violations of the rules above, missing
              tests for changed code, secrets, or a concrete correctness bug.
              Everything else is WARN.
            The FINAL line of the file must be exactly `VERDICT: PASS` (zero
            blockers) or exactly `VERDICT: FAIL`.

      - name: Post review and enforce verdict
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ ! -f claude-review.md ]; then
            echo "::error::Claude produced no claude-review.md — failing closed."
            exit 1
          fi
          {
            cat claude-review.md
            printf '\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_\n'
          } > /tmp/review-comment.md
          gh pr comment "$PR" --body-file /tmp/review-comment.md || true
          if grep -q '^VERDICT: PASS$' claude-review.md; then
            echo "Claude Review: PASS"
          else
            echo "::error::Claude Review verdict is FAIL (or missing) — see the PR comment."
            exit 1
          fi
