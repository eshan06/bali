# The one-address load gate (Phase 4, L2b; ISSUES #1): the load harness's school at the bell,
# 600 phones behind one address, driven by k6 against the real API on a real Postgres while one
# account floods; then the sweep timed at that size. What passes: apps/api/scripts/load/gate.js.
name: Load gate

on:
  pull_request:
  workflow_dispatch:
    inputs:
      bell:
        description: >-
          Also measure the bell with the class-started push (#336), report-only: runs separated by
          spaces, each window:pool:read or window:pool:read:teachers, such as "1:10:me 1:20:me
          30:10:me 1:10:light 1:10:me:40" (the seconds a rung phone takes to open Bali, the API's
          database connections, its first read, the school's teachers with 30 students each, 20
          unless named). Empty, the gate alone.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: load-gate-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  # Decided here, not by a paths filter on the workflow: a workflow filtered
  # out never reports, so a required check would wait on it forever, while a
  # job skipped by its `if` reports success (as in ios.yml). By hand, it runs.
  changes:
    name: Load gate changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.diff.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          # Through env, never inline: refnames may contain $, backticks, ;.
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        # The self-test first, as in ios.yml; each on its own line, so a
        # failure fails the step. touches.sh says how a moved file counts.
        run: |
          run=true
          if [ "$EVENT" = pull_request ]; then
            .github/scripts/touches.test.sh
            run=$(.github/scripts/touches.sh "origin/$BASE_REF" '^(apps/api/|packages/(db|shared)/|package(-lock)?\.json$|\.nvmrc$|\.github/workflows/load-gate\.yml$)')
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  gate:
    name: One-address load gate (k6)
    needs: changes
    # Skipped only on the decision's false, so a decision that failed runs the
    # gate: "Load gate changes" is no required check, and a gate skipped
    # because it failed would count as passed.
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      # The harness's opt-in: this server is the runner's own service container.
      LOAD_LOCAL_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The k6 the gate was measured with, from the action pinned to its commit.
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0
      - run: npm run load:seed
      - name: Serve the school (the API, in the background)
        working-directory: apps/api
        run: |
          node --import tsx scripts/load/serve.ts > "$RUNNER_TEMP/api.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/api.pid"
          for _ in $(seq 30); do
            curl -fsS http://127.0.0.1:3001/healthz > /dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: The bell and the flood (k6)
        run: npm run load:gate -- --quiet
      - name: Stop the API (its own minute sweep would race the timed one)
        run: |
          pid=$(cat "$RUNNER_TEMP/api.pid")
          kill -TERM "$pid"
          timeout 20 tail --pid="$pid" -f /dev/null
      - name: The sweep at that size
        run: npm run load:sweep
      - name: The API's warnings and errors
        if: failure()
        run: grep -E '"level":(40|50|60)' "$RUNNER_TEMP/api.log" | tail -n 100 || true

  # By hand only, and never a check on a PR (#336): the bell with the class-started push's arrival,
  # apps/api/scripts/load/bell.js, whose thresholds cannot fail. Each run of the `bell` input seeds
  # the school afresh, serves it at that many database connections and rings it; k6's numbers and
  # the connections the API held go to the run's summary. The gate above runs beside it, unchanged.
  bell:
    name: The bell with the push (k6, by hand)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bell != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      LOAD_LOCAL_POSTGRES: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 2.3.0
      - name: Each run, a school seeded afresh, the API at its pool, and the bell (k6)
        working-directory: apps/api
        env:
          # Through env, never inline: the input is typed by hand.
          RUNS: ${{ inputs.bell }}
          POSTGRES: ${{ job.services.postgres.id }}
        run: |
          set -f # a run is text, never a file pattern
          # Postgres's CPU, read from its container's cgroup (systemd's driver, else cgroupfs's).
          cgroup=/sys/fs/cgroup/system.slice/docker-$POSTGRES.scope/cpu.stat
          [ -r "$cgroup" ] || cgroup=/sys/fs/cgroup/docker/$POSTGRES/cpu.stat
          # A run's busiest second, by its column of the sampler's log (below).
          busiest() { sort -n -k"$1" "$cpu" | tail -n 1 | cut -d' ' -f"$1"; }
          n=0
          for run in $RUNS; do
            n=$((n + 1))
            if ! [[ "$run" =~ ^([0-9]{1,2}):([0-9]{1,2}):(me|light)(:([0-9]{1,2}))?$ ]]; then
              echo "::error::each run is window:pool:read[:teachers], such as 1:10:me, not $run"
              exit 1
            fi
            window=${BASH_REMATCH[1]} pool=${BASH_REMATCH[2]} read=${BASH_REMATCH[3]}
            LOAD_TEACHERS=${BASH_REMATCH[5]} npm run load:seed
            log="$RUNNER_TEMP/api-$n.log"
            LOAD_DB_POOL=$pool node --import tsx scripts/load/serve.ts > "$log" 2>&1 &
            pid=$!
            for _ in $(seq 30); do
              curl -fs http://127.0.0.1:3001/healthz > /dev/null && break
              sleep 1
            done
            curl -fsS http://127.0.0.1:3001/healthz > /dev/null || { cat "$log"; exit 1; }
            # Each second, the CPU the API's main thread (its event loop) and Postgres used, in
            # hundredths of a core: 100 is one core the whole second.
            cpu="$RUNNER_TEMP/cpu-$n.log"
            (
              api='' db=''
              while read -r -a stat < "/proc/$pid/task/$pid/stat"; do
                ticks=$((stat[13] + stat[14]))
                usec=$(awk '/^usage_usec/ { print int($2 / 10000) }' "$cgroup" 2> /dev/null || true)
                [ -n "$api" ] && echo "$((ticks - api)) $((${usec:-0} - ${db:-0}))"
                api=$ticks db=${usec:-0}
                sleep 1
              done
            ) > "$cpu" 2> /dev/null &
            sampler=$!
            status=0
            k6 run --quiet -e ARRIVAL_WINDOW="$window" -e FIRST_READ="$read" scripts/load/bell.js \
              | tee "$RUNNER_TEMP/k6-$n.log" || status=$?
            # postgres.js keeps each connection it opens: the most the API held at once.
            held=$(docker exec "$POSTGRES" psql -U postgres -tAc \
              "select count(*) from pg_stat_activity where datname = 'bali_load'")
            kill "$sampler" 2> /dev/null || true
            kill -TERM "$pid"
            timeout 20 tail --pid="$pid" -f /dev/null
            pg=unread
            [ -r "$cgroup" ] && pg=$(busiest 2)
            {
              echo "### Run $n ($run): each rung phone within $window s, $pool connections, a first read of $read"
              echo "k6 exited $status; the API held $held database connections; at their busiest" \
                "second, the API's main thread used $(busiest 1) and Postgres $pg hundredths of a core."
              echo "The API's warnings and errors:"
              grep -E '"level":(40|50|60)' "$log" | grep -o '"msg":"[^"]*"' | sort | uniq -c || true
              echo '```'
              sed -n '/TOTAL RESULTS/,$p' "$RUNNER_TEMP/k6-$n.log"
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
            if [ "$status" != 0 ]; then
              grep -E '"level":(40|50|60)' "$log" | tail -n 50 || true
              exit "$status"
            fi
          done
