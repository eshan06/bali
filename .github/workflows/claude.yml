# The @claude assistant: comment `@claude <ask>` on a PR or issue and Claude
# acts on it (fix the failing test, address review findings, answer a
# question), pushing to the PR branch when needed. Restricted to people with
# write access so drive-by comments can't burn the owner's subscription usage.
name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write # the action mints its GitHub App token via OIDC

jobs:
  claude:
    name: Claude assistant
    if: >-
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --model claude-opus-5
