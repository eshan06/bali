name: CI

on:
  push:
    # main only. Branch commits get their CI from the pull_request event;
    # running both events on the same commit left a concurrency-cancelled
    # twin of each required check on the head SHA, and branch rulesets count
    # a cancelled required check as unmet — auto-merge blocked on #9 exactly
    # that way.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # One group per event + branch: a newer push to the same PR cancels the
  # outdated run, and a push to main can never share a group with (and
  # cancel) a PR whose head branch happens to be named "main". On push
  # head_ref is empty, so ref_name is used; on a PR head_ref is the source
  # branch.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # The contract fixtures are the API's real answers to a phone, which
      # BaliCore decodes. `npm test` already fails when one drifts; this runs
      # the generator itself and fails on any diff — new, changed or deleted —
      # so the committed tree is exactly what `npm run fixtures` writes.
      - run: npm run fixtures && git add --intent-to-add contracts/fixtures && git diff --exit-code -- contracts/fixtures
      # A schema.ts change must ship with its generated migration: regenerate
      # and fail if anything under migrations/ differs from what's committed.
      - run: npm run db:generate -w @bali/db && git diff --exit-code -- packages/db/migrations
      # tsc alone doesn't exercise the Next build (the webpack extensionAlias
      # that resolves @bali/shared's .js specifiers, Tailwind's PostCSS step),
      # so a portal that type-checks but cannot build would merge green.
      - run: npm run build -w @bali/web

  # The same Vitest suite, but against a real multi-connection Postgres. This is
  # the only lane where the engine's FOR UPDATE serialization actually contends,
  # so the race tests (packages/db/test/races.test.ts) run here and are skipped
  # on the fast PGlite lane above. TEST_DATABASE_URL flips the shared test-db
  # factory (@bali/db/testing) onto Postgres.
  test-postgres:
    name: Integration + race tests (real Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # localhost is correct because the service container's 5432 is published
          # to the runner VM; if this job is ever moved to run inside a container,
          # the host becomes the service name (postgres) instead.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Asserted by packages/db/test/real-lane.test.ts: if this lane ever
          # loses TEST_DATABASE_URL, fail the job instead of silently skipping
          # the race tests.
          REQUIRE_REAL_PG: '1'

  # BaliCore, the iOS apps' Swift package, decodes every contract fixture and
  # mirrors @bali/shared's vocabularies, so a change to an answer, a fixture or
  # a vocabulary goes red here until the Swift types catch up. It is Foundation
  # only, so it runs on Linux in Swift's official image — no macOS minutes.
  # On every PR, not path-filtered: the contract spans apps/api (which writes
  # the fixtures), packages/shared, contracts/ and ios/, and a filtered job
  # never reports on the PRs it skips, so it could not be made required.
  swift:
    name: BaliCore Swift tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@v4
      # SwiftPM's build output: a warm one about halves the build (its module
      # caches survive a fresh checkout). The key names the image — bump both
      # together, so a new compiler starts clean — and hashes the sources, so
      # a change saves a fresh cache.
      - uses: actions/cache@v4
        with:
          path: ios/BaliCore/.build
          key: balicore-swift6.4-noble-${{ hashFiles('ios/BaliCore/**/*.swift') }}
          restore-keys: balicore-swift6.4-noble-
      - run: swift test
        working-directory: ios/BaliCore
