name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck · shared tests · web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (all workspaces)
        run: npm run typecheck
      - name: Unit tests (@bali/shared)
        run: npm test --workspace @bali/shared
      - name: Web build
        run: npm run build --workspace @bali/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/v1
          # Placeholders satisfy the prod-build env guard (apps/web/src/lib/env.ts);
          # CI checks that the bundle builds, it never ships one.
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_test000000
          NEXT_PUBLIC_COGNITO_CLIENT_ID: testclient00000000
          NEXT_PUBLIC_COGNITO_DOMAIN: test.auth.us-east-1.amazoncognito.com
          NEXT_PUBLIC_REDIRECT_URI: https://portal.example.com/auth/callback

  api-integration:
    name: API integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bali_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The suite reads TEST_DATABASE_URL only; it never touches a real DATABASE_URL.
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bali_test?sslmode=disable
      DEFAULT_SCHOOL_ID: '11111111-1111-1111-1111-111111111111'
      COGNITO_USER_POOL_ID: us-east-1_test000000
      COGNITO_CLIENT_ID: testclient00000000
      SEED_TEACHER_EMAIL: teacher@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Integration tests (@bali/api)
        run: npm test --workspace @bali/api
