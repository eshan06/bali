name: CI

on:
  push:
    # main only. Branch commits get their CI from the pull_request event;
    # running both events on the same commit left a concurrency-cancelled
    # twin of each required check on the head SHA, and branch rulesets count
    # a cancelled required check as unmet — auto-merge blocked on #9 exactly
    # that way.
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # PR runs: one group per PR branch, and a newer push cancels the outdated
  # run. On a PR head_ref is the source branch; the event prefix keeps a PR
  # whose head branch is named "main" out of main's groups.
  #
  # Pushes to main: never cancelled. Each merge keeps its own post-merge run —
  # a newer merge cancelling it left a cancelled ✗ on a commit nothing was
  # wrong with (#229). The group is the commit (head_ref is empty on push),
  # not the branch, because cancel-in-progress: false alone is not enough:
  # GitHub still cancels a PENDING run in a group when a newer one queues,
  # so three quick merges would cancel the middle one's run.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Two deep, for the API snapshot's baseline: HEAD^1 (its step says why).
          fetch-depth: 2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Phase 6, S5: no known high or critical advisory in what ships (dev tools
      # never reach a phone or the API), and every package as the registry signed it.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm audit signatures
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Phase 6, C1: each iOS bundle's privacy manifest is there, parses, and
      # declares every required-reason API its Swift calls (the script says
      # what else). Every upload is checked against them, TestFlight included.
      - run: python3 .github/scripts/privacy-manifests.test.py
      - run: python3 .github/scripts/privacy-manifests.py
      # Phase 6, S6: the scan claude-review.yml runs on a review before posting
      # it, against made-up secrets and ordinary reviews.
      - run: python3 .github/scripts/review-secrets.test.py
      # The contract fixtures are the API's real answers to a phone, which
      # BaliCore decodes, contracts/outbox/ the outbox tables' answers on
      # every input BaliCore's port must match, and contracts/openapi.json
      # every route and the request schema it parses. `npm test` already fails
      # when one drifts; this runs the generators themselves and fails on any
      # diff — new, changed or deleted — so the committed tree is exactly what
      # `npm run fixtures` writes. A removal from /v1 fails before anything is
      # written (additive-only), judged against the base's copy of
      # contracts/openapi.json, put in place first (O1b): a branch can delete,
      # regenerate or edit its own copy, never the base's.
      - name: The base's API snapshot, the baseline for additive-only
        # On a PR, HEAD is the PR merged into its base (actions/checkout's
        # default ref), so its first parent is the very base this tree was
        # built on, however main has moved since; on a push to main, it is
        # main before the push (main takes squash merges: one commit a push).
        # Any other HEAD that is no merge would make the baseline the branch's
        # own past, so it fails: a new trigger decides its baseline first.
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != push ] && ! git rev-parse -q --verify HEAD^2 >/dev/null; then
            echo "::error::HEAD is not a merge into its base, so HEAD^1 is no baseline"
            exit 1
          fi
          git show HEAD^1:contracts/openapi.json > contracts/openapi.json || {
            echo "::error::the base has no contracts/openapi.json to judge a removal against"
            exit 1
          }
      - run: npm run fixtures && git add --intent-to-add contracts && git diff --exit-code -- contracts
      # A schema.ts change must ship with its generated migration: regenerate
      # and fail if anything under migrations/ differs from what's committed.
      - run: npm run db:generate -w @bali/db && git diff --exit-code -- packages/db/migrations
      # tsc alone doesn't exercise the Next build (the webpack extensionAlias
      # that resolves @bali/shared's .js specifiers, Tailwind's PostCSS step),
      # so a portal that type-checks but cannot build would merge green.
      # A route built ahead carries no CSP nonce, so its scripts are refused:
      # a blank page (Phase 6, S4). Every route must be dynamic (ƒ).
      - run: .github/scripts/web-routes-dynamic.test.sh
      - name: Build the portal, every route rendered per request
        shell: bash
        env:
          # A production build needs the API's URL (src/lib/csp.ts, checkBuildEnv).
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: |
          log="$RUNNER_TEMP/web-build.log"
          npm run build -w @bali/web >"$log" 2>&1 || { cat "$log"; exit 1; }
          cat "$log"
          .github/scripts/web-routes-dynamic.sh "$log"
      # The build above, served: a page's scripts carry the nonce its CSP names,
      # or the browser refuses them all (Phase 6, S4).
      - run: .github/scripts/web-csp-nonce.test.sh
      - name: The served portal's scripts carry the CSP's nonce
        shell: bash
        env:
          NEXT_PUBLIC_API_URL: https://api.example.invalid
        run: |
          npm run start -w @bali/web -- --port 3100 >"$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 30); do
            curl -fsS -D "$RUNNER_TEMP/login.headers" -o "$RUNNER_TEMP/login.html" \
              http://127.0.0.1:3100/login 2>/dev/null && break
            sleep 1
          done
          [ -s "$RUNNER_TEMP/login.html" ] || { cat "$RUNNER_TEMP/web.log"; exit 1; }
          .github/scripts/web-csp-nonce.sh "$RUNNER_TEMP/login.headers" "$RUNNER_TEMP/login.html"

  # The same Vitest suite, but against a real multi-connection Postgres. This is
  # the only lane where the engine's FOR UPDATE serialization actually contends,
  # so the race tests (packages/db/test/races.test.ts) run here and are skipped
  # on the fast PGlite lane above. TEST_DATABASE_URL flips the shared test-db
  # factory (@bali/db/testing) onto Postgres.
  test-postgres:
    name: Integration + race tests (real Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          # localhost is correct because the service container's 5432 is published
          # to the runner VM; if this job is ever moved to run inside a container,
          # the host becomes the service name (postgres) instead.
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
          # Asserted by packages/db/test/real-lane.test.ts: if this lane ever
          # loses TEST_DATABASE_URL, fail the job instead of silently skipping
          # the race tests.
          REQUIRE_REAL_PG: '1'

  # BaliCore, the iOS apps' Swift package, decodes every contract fixture and
  # mirrors @bali/shared's vocabularies, so a change to an answer, a fixture or
  # a vocabulary goes red here until the Swift types catch up. It is Foundation
  # only, so it runs on Linux in Swift's official image — no macOS minutes.
  # On every PR, not path-filtered: the contract spans apps/api (which writes
  # the fixtures), packages/shared, contracts/ and ios/, and a filtered job
  # never reports on the PRs it skips, so it could not be made required.
  # BaliOutbox's tests run here too: they settle the same answers.
  swift:
    name: BaliCore Swift tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.4-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # SwiftPM's build output: a warm one about halves the build (its module
      # caches survive a fresh checkout). The key names the image — bump both
      # together, so a new compiler starts clean — and hashes the sources, so
      # a change saves a fresh cache. Only the sources, by their own folders:
      # the key is evaluated again on the host after the job, when .build is
      # there, written from inside the container, and a pattern that reaches
      # into it fails the job (ios/BaliCore/**/*.swift did).
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios/BaliCore/.build
          key: balicore-swift6.4-noble-${{ hashFiles('ios/BaliCore/Package.swift', 'ios/BaliCore/Sources/**', 'ios/BaliCore/Tests/**') }}
          restore-keys: balicore-swift6.4-noble-
      - run: swift test
        working-directory: ios/BaliCore
      # GRDB builds against the system SQLite, whose headers the image lacks;
      # an Ubuntu mirror mid-sync fails an update now and then, so three tries.
      - run: |
          for try in 1 2 3; do apt-get update -qq && break; [ "$try" = 3 ] && exit 1; sleep 20; done
          apt-get install -y -qq --no-install-recommends libsqlite3-dev
      - run: swift test
        working-directory: ios/BaliOutbox
