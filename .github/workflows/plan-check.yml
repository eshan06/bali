# The plan backstop: a PR that changes source code (apps/, packages/, ios/,
# android/) must also update docs/PLAN.md, so every session/contributor leaves
# the shared status doc accurate. Escape hatch for trivial fixes: put
# [no-plan] in a commit message. It also keeps docs/PLAN.md, which every
# session reads first, under 8,000 words, and docs/PLAN-ANDROID.md under
# 6,000: the current state only, finished history in docs/PLAN-ARCHIVE.md.
name: Plan doc

on:
  pull_request:

permissions:
  contents: read

jobs:
  plan-updated:
    name: Plan doc updated
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      # Its self-test first, so a check that stops counting fails instead of passing.
      - run: .github/scripts/plan-words.test.sh
      - name: docs/PLAN.md stays under 8,000 words
        run: .github/scripts/plan-words.sh docs/PLAN.md 8000
      - name: docs/PLAN-ANDROID.md stays under 6,000 words
        run: .github/scripts/plan-words.sh docs/PLAN-ANDROID.md 6000

      # Its self-test first, as above. plan-updated.sh says what counts.
      - run: .github/scripts/plan-updated.test.sh
      - name: Source changes must update docs/PLAN.md
        env:
          # Through env, not inline interpolation, so neither the author
          # string nor the base refname ever becomes shell syntax (refnames
          # may contain $, backticks, ;).
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE_REF: ${{ github.base_ref }}
        run: .github/scripts/plan-updated.sh "origin/$BASE_REF" "$PR_AUTHOR"
