# Gradle's own JVM: Android Studio's default heap, and UTF-8 whatever the machine's default.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The build runs on the JDK that is there (README.md): Gradle never downloads one.
org.gradle.java.installations.auto-download=false
# Nor does the Android plugin install a missing SDK package: the build fails and names it.
android.builder.sdkDownload=false
# The Release build's own JVM tests too (app/src/testRelease, its start's rules), where AGP 9 makes the
# Debug build's alone.
android.onlyEnableUnitTestForTheTestedBuildType=false
kotlin.code.style=official
