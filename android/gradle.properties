# Gradle's own JVM: Android Studio's default heap, and UTF-8 whatever the machine's default.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# The build runs on the JDK that is there (README.md): Gradle never downloads one.
org.gradle.java.installations.auto-download=false
# Nor does the Android plugin install a missing SDK package: the build fails and names it.
android.builder.sdkDownload=false
kotlin.code.style=official
