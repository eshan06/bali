# Every version the build names (README.md, "Updating"). AGP's own Kotlin is upgraded to `kotlin`.
[versions]
agp = "9.5.0"
kotlin = "2.4.21"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
okhttp = "5.4.0"
animalsniffer = "2.0.1"
gummy-bears = "0.16.0"
ksp = "2.3.13"
room = "2.8.5"
sqlite = "2.7.1"
androidx-test = "1.7.0"
androidx-test-junit = "1.3.0"

[libraries]
# Kotlin's assertions on JUnit 5, its engine and the launcher Gradle 9 no longer brings itself.
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
# The JSON coding of every body (core's Json.kt); its compiler plugin is Kotlin's own.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
# Swift's async: the API client's calls suspend, and wait on OkHttp's call, cancellable.
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# The API client's transport (core's OkHttpTransport.kt); 5.5's Android build needs compileSdk 37 (README.md).
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# A local HTTP server, for the transport's tests.
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# Android 10's API (minSdk 29) as animal-sniffer signatures, with the calls D8 rewrites for it.
gummy-bears-api29 = { module = "com.toasttab.android:gummy-bears-api-29", version.ref = "gummy-bears" }
# The outbox's file (outbox's OutboxDatabase.kt): Room, its code generated through KSP, over the
# SQLite it bundles, the same on the JVM's tests and on the phone (README.md).
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
# The app's instrumented tests, on an emulator (app/src/androidTest).
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
animalsniffer = { id = "ru.vyarus.animalsniffer", version.ref = "animalsniffer" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
