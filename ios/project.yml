# The student app and its two extensions, as XcodeGen's spec (ARCHITECTURE, "iOS app
# structure"). `xcodegen generate` in this folder writes Bali.xcodeproj, which is not
# committed: this file is the project. See README.md.
name: Bali

options:
  deploymentTarget:
    iOS: '17.0'

settings:
  base:
    # The identifiers are v2's, as the Family Controls entitlement request used them.
    DEVELOPMENT_TEAM: H535678UF8
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: '1.0'
    CURRENT_PROJECT_VERSION: '1'
    SWIFT_VERSION: '6.0'
    # Xcode writes each Info.plist's bundle keys; the target's own file holds the rest.
    GENERATE_INFOPLIST_FILE: YES

packages:
  BaliCore:
    path: BaliCore
  # The student's outbox, in the app group (student-only: the teacher app has none).
  BaliOutbox:
    path: BaliOutbox

# Each target is iPhone only (TARGETED_DEVICE_FAMILY 1): XcodeGen's iOS preset sets iPhone
# and iPad per target, over anything the project sets.
targets:
  # The student app: screens, sign-in, the NFC tap, turning shields on.
  Bali:
    type: application
    platform: iOS
    sources:
      - path: Bali
        # D1's tokens, which Theme.swift's colours are: the app needs none of it, so it ships in
        # the tests' bundle alone (BaliTests, below).
        excludes: [UI/bali-tokens.json, PrivacyInfo.xcprivacy]
      # Each bundle's privacy manifest (Phase 6, C1), a resource: App Store Connect reads it at
      # every upload. A Linux check holds it to the code (.github/scripts/privacy-manifests.py).
      - path: Bali/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bali.Bali
        INFOPLIST_FILE: Bali/Info.plist
        CODE_SIGN_ENTITLEMENTS: Bali/Bali.entitlements
        TARGETED_DEVICE_FAMILY: '1'
        # The home-screen icon: Bali/Assets.xcassets's AppIcon, one 1024 image (Xcode makes every
        # size), the mark on its stone-50 tile. Named here, the build writes CFBundleIcons'
        # CFBundlePrimaryIcon.CFBundleIconName, which ios.yml and the TestFlight guard check.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Where the app signs in and syncs (B4), read from Info.plist: public values, no secret —
        # the phone's Cognito app client is a public one. Dev's, until prod exists (Phase 5) and a
        # Release configuration overrides them: its API (Railway named it before the environment
        # was renamed dev), its pool's hosted-UI domain, and the phone's app client `bali-ios-dev-public`,
        # whose id dev's AUTH_AUDIENCE lists (docs/DEPLOY.md, "The phone's sign-in"). A build with
        # one of them empty says sign-in is not set up. BaliCore's `AppConfig` reads them, and its
        # tests pin these names to Bali/Info.plist's keys.
        BALI_API_URL: https://bali-production-09a2.up.railway.app
        BALI_COGNITO_DOMAIN: https://bali-dev.auth.us-east-1.amazoncognito.com
        BALI_COGNITO_CLIENT_ID: '7u6trs6gv805oi35ima29em6oe'
        # Caught by the sign-in's own browser session, so it is no URL type of the app's: no other
        # app or page can open the app with an answer.
        BALI_COGNITO_REDIRECT_URI: bali://auth/callback
        # The portal whose privacy policy and terms the app links (C2b): production's for every
        # configuration, since the policy pages live only there — no Release override, and the
        # TestFlight release guard, which checks the sign-in's keys, needs none for it.
        BALI_PORTAL_URL: https://bali-portal.vercel.app
    dependencies:
      - package: BaliCore
      - package: BaliOutbox
      # Both extensions ship inside the app.
      - target: BaliMonitor
      - target: BaliShield
    scheme:
      testTargets: [BaliTests]

  # The app's own tests (B5b-2), hosted in the app on the iOS Simulator. They depend on the
  # packages as the app does, so `@testable import Bali` finds every module the app imports —
  # GRDB's C module among them — though the bundle then carries its own copy of their code.
  BaliTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - BaliTests
      # D1's tokens, for AppTests.tokens to pin Theme.swift's colours to: a copy in the bundle, since
      # the Simulator may not read the checkout in place (macOS keeps it out of ~/Downloads).
      - path: Bali/UI/bali-tokens.json
        buildPhase: resources
      # The shield's configuration, compiled here too (an extension's code is no module to
      # import): AppTests holds what it hands iOS to ShieldWords and to the tokens (D2k).
      - BaliShield/ShieldConfigurationExtension.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bali.BaliTests
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      - target: Bali
      - package: BaliCore
      - package: BaliOutbox

  # The DeviceActivity monitor: iOS wakes it at the end of the window the shields are on, with
  # the app open or not (decision 2), and it takes them off when nothing keeps them on (B5b).
  BaliMonitor:
    type: app-extension
    platform: iOS
    sources:
      - path: BaliMonitor
        excludes: [PrivacyInfo.xcprivacy]
      - path: BaliMonitor/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bali.Bali.BaliMonitor
        INFOPLIST_FILE: BaliMonitor/Info.plist
        CODE_SIGN_ENTITLEMENTS: BaliMonitor/BaliMonitor.entitlements
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      # The outbox file, read where the app keeps it: in the app group.
      - package: BaliOutbox

  # The shield a student sees over a blocked app or website: Bali's own, in the design system's
  # light tokens, its words the same wherever the phone stands (B5c, B5c-2, D2k).
  BaliShield:
    type: app-extension
    platform: iOS
    sources:
      - path: BaliShield
        excludes: [PrivacyInfo.xcprivacy]
      - path: BaliShield/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bali.Bali.BaliShield
        INFOPLIST_FILE: BaliShield/Info.plist
        CODE_SIGN_ENTITLEMENTS: BaliShield/BaliShield.entitlements
        TARGETED_DEVICE_FAMILY: '1'
    dependencies:
      # The shield's words (`ShieldWords`): it reads nothing — its sandbox refuses the outbox
      # file (B5c-2).
      - package: BaliOutbox
